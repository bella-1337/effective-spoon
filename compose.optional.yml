# OCI image labels for every image this repository builds. The organisation,
# identified by STACK_DOMAIN, is the vendor. Export STACK_REPOSITORY_REVISION
# (for example "$(git rev-parse HEAD)") before building so the revision label
# identifies the exact repository commit. created, source, and url are always
# set so labels inherited from a base image cannot describe the wrong software;
# Docker's own image creation time remains authoritative.
x-own-image-labels: &own-image-labels
  org.opencontainers.image.vendor: ${STACK_DOMAIN:?Set STACK_DOMAIN in .env}
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.revision: ${STACK_REPOSITORY_REVISION:-unknown}
  org.opencontainers.image.source: ${STACK_REPOSITORY_URL:-}
  org.opencontainers.image.url: ${STACK_REPOSITORY_URL:-}
  org.opencontainers.image.created: ""

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

# Resource tiers, mirrored from docker-compose.yml because YAML anchors do not
# cross the include boundary. Values come from .env. The maintenance contracts
# fail when these, x-own-image-labels, or x-default-logging drift from the core
# file.
x-resources-tiny: &resources-tiny
  resources:
    limits:
      cpus: "${RESOURCE_TINY_CPU_LIMIT:-0.5}"
      memory: ${RESOURCE_TINY_MEMORY_LIMIT:-256m}
x-resources-small: &resources-small
  resources:
    limits:
      cpus: "${RESOURCE_SMALL_CPU_LIMIT:-1}"
      memory: ${RESOURCE_SMALL_MEMORY_LIMIT:-1g}
x-resources-medium: &resources-medium
  resources:
    limits:
      cpus: "${RESOURCE_MEDIUM_CPU_LIMIT:-2}"
      memory: ${RESOURCE_MEDIUM_MEMORY_LIMIT:-2g}
x-resources-database: &resources-database
  resources:
    limits:
      cpus: "${RESOURCE_DATABASE_CPU_LIMIT:-2}"
      memory: ${RESOURCE_DATABASE_MEMORY_LIMIT:-4g}

x-langfuse-environment: &langfuse-environment
  HOSTNAME: 0.0.0.0
  TZ: UTC
  NEXTAUTH_URL: https://${LANGFUSE_WEB_HOST:?Set LANGFUSE_WEB_HOST in .env.optional}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "${LANGFUSE_TELEMETRY_ENABLED:-false}"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
  REDIS_TLS_ENABLED: "${LANGFUSE_REDIS_TLS_ENABLED:-false}"

networks:
  # Include resources cannot be redeclared by the parent. These three shared
  # networks are defined here once and used by both core and optional services.
  edge: {}
  internal: {}
  alloy-monitor:
    internal: true
  security-monitor: {}
  # Lens and its ClickHouse store only; nothing else, including Prometheus,
  # can reach the trace database.
  lens-storage:
    internal: true

volumes:
  grafana-data: {}
  loki-data: {}
  alloy-loki-data: {}
  langfuse-postgres-data: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-minio-data: {}
  langfuse-redis-data: {}
  lens-clickhouse-data: {}

services:
  # ---------------------------------------------------------------------------
  # grafana profile: Grafana, Loki, and the Loki collector
  # ---------------------------------------------------------------------------

  loki:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-medium
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alloy-loki:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    user: "473:473"
    command: ["run", "/etc/alloy/loki.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-litellm-stack}
    volumes:
      - ./alloy/loki.alloy:/etc/alloy/loki.alloy:ro
      - alloy-loki-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      alloy-docker-proxy:
        condition: service_healthy
    networks: [internal, alloy-monitor]
    restart: unless-stopped
    deploy: *resources-medium

  grafana-db-init:
    logging: *default-logging
    profiles: [grafana]
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$GRAFANA_DATABASE_PASSWORD" || { echo "Set GRAFANA_DATABASE_PASSWORD in .env.optional to use the grafana profile" >&2; exit 64; }
        psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
        \getenv grafana_password GRAFANA_DATABASE_PASSWORD
        SELECT format('CREATE ROLE grafana_ro LOGIN PASSWORD %L', :'grafana_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_ro') \gexec
        SELECT format('ALTER ROLE grafana_ro PASSWORD %L', :'grafana_password') \gexec
        SQL
        for db in litellm_prod litellm_dev; do
          psql --dbname "$${db}" --set ON_ERROR_STOP=1 --set database_name="$${db}" <<'SQL'
        GRANT CONNECT ON DATABASE :"database_name" TO grafana_ro;
        GRANT USAGE ON SCHEMA public TO grafana_ro;
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_ro;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafana_ro;
        SQL
        done
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:-}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  grafana:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "Set GRAFANA_ADMIN_PASSWORD in .env.optional to use the grafana profile" >&2; exit 64; }
        test -n "$${GF_SECURITY_SECRET_KEY}" || { echo "Set GRAFANA_SECURITY_SECRET_KEY in .env.optional to use the grafana profile" >&2; exit 64; }
        test -n "$${GRAFANA_DATABASE_PASSWORD}" || { echo "Set GRAFANA_DATABASE_PASSWORD in .env.optional to use the grafana profile" >&2; exit 64; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECURITY_SECRET_KEY:-}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?Set GRAFANA_HOST in .env.optional}
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP:-false}"
      GRAFANA_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana_ro}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    deploy: *resources-small
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:?Set GRAFANA_HOST in .env.optional}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # langfuse profile: Langfuse web and worker with their stores
  # ---------------------------------------------------------------------------

  langfuse-preflight:
    logging: *default-logging
    profiles: [langfuse]
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$LANGFUSE_POSTGRES_PASSWORD" || { echo "Set LANGFUSE_POSTGRES_PASSWORD in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_CLICKHOUSE_PASSWORD" || { echo "Set LANGFUSE_CLICKHOUSE_PASSWORD in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_REDIS_AUTH" || { echo "Set LANGFUSE_REDIS_AUTH in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_MINIO_PASSWORD" || { echo "Set LANGFUSE_MINIO_PASSWORD in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_NEXTAUTH_SECRET" || { echo "Set LANGFUSE_NEXTAUTH_SECRET in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_SALT" || { echo "Set LANGFUSE_SALT in .env.optional to use the langfuse profile" >&2; exit 64; }
        printf '%s' "$$LANGFUSE_ENCRYPTION_KEY" | grep -Eq '^[[:xdigit:]]{64}$' || { echo "Set LANGFUSE_ENCRYPTION_KEY to exactly 64 hexadecimal characters to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_PUBLIC_KEY" || { echo "Set LANGFUSE_PUBLIC_KEY in .env to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_SECRET_KEY" || { echo "Set LANGFUSE_SECRET_KEY in .env to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_USER_ID_SALT" || { echo "Set LANGFUSE_USER_ID_SALT in .env to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_INIT_USER_EMAIL" || { echo "Set LANGFUSE_INIT_USER_EMAIL in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_INIT_USER_NAME" || { echo "Set LANGFUSE_INIT_USER_NAME in .env.optional to use the langfuse profile" >&2; exit 64; }
        test -n "$$LANGFUSE_INIT_USER_PASSWORD" || { echo "Set LANGFUSE_INIT_USER_PASSWORD in .env.optional to use the langfuse profile" >&2; exit 64; }
    environment:
      LANGFUSE_POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      LANGFUSE_CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      LANGFUSE_REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
      LANGFUSE_MINIO_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_SALT: ${LANGFUSE_SALT:-}
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  langfuse-postgres:
    logging: *default-logging
    profiles: [langfuse]
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy: *resources-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    logging: *default-logging
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./langfuse/clickhouse/config.d/observability.xml:/etc/clickhouse-server/config.d/observability.xml:ro
      - ./langfuse/clickhouse/users.d/observability.xml:/etc/clickhouse-server/users.d/observability.xml:ro
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks: [internal]
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy: *resources-database
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-clickhouse-observability-setup:
    logging: *default-logging
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec clickhouse-client \
          --host langfuse-clickhouse \
          --user "$$CLICKHOUSE_USER" \
          --password "$$CLICKHOUSE_PASSWORD" \
          --multiquery \
          --queries-file /cleanup/cleanup-system-logs.sql
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./langfuse/clickhouse/cleanup-system-logs.sql:/cleanup/cleanup-system-logs.sql:ro
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  langfuse-minio:
    logging: *default-logging
    profiles: [langfuse]
    image: cgr.dev/chainguard/minio:latest@sha256:c47b1779bfd12cdf5a4fcd3bd50671b8d66465fdae45271babc2fb467958b712
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
    volumes:
      - langfuse-minio-data:/data
    networks: [edge, internal]
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy: *resources-small
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse-s3.rule=Host(`${LANGFUSE_S3_HOST:?Set LANGFUSE_S3_HOST in .env.optional}`)
      - traefik.http.routers.langfuse-s3.entrypoints=websecure
      - traefik.http.routers.langfuse-s3.tls=true
      - traefik.http.services.langfuse-s3.loadbalancer.server.port=9000

  langfuse-redis:
    logging: *default-logging
    profiles: [langfuse]
    image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:-}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-}
    volumes:
      - langfuse-redis-data:/data
    networks: [internal]
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy: *resources-small
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-worker:
    logging: *default-logging
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
    environment:
      <<: *langfuse-environment
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-clickhouse-observability-setup:
        condition: service_completed_successfully
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-medium
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    logging: *default-logging
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse:4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: https://${LANGFUSE_S3_HOST:?Set LANGFUSE_S3_HOST in .env.optional}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-litellm-stack}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-LiteLLM Stack}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-litellm}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-LiteLLM}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      LANGFUSE_TRUSTED_PROXY_COUNT: "${LANGFUSE_TRUSTED_PROXY_COUNT:-1}"
      # Private stack: users come only from LANGFUSE_INIT_USER_* (see the
      # operator account runbook in docs/environment-variables.md).
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "${LANGFUSE_DISABLE_SIGNUP_ONBOARDING:-true}"
    depends_on:
      langfuse-preflight:
        condition: service_completed_successfully
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-clickhouse-observability-setup:
        condition: service_completed_successfully
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    deploy: *resources-medium
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse.rule=Host(`${LANGFUSE_WEB_HOST:?Set LANGFUSE_WEB_HOST in .env.optional}`)
      - traefik.http.routers.langfuse.entrypoints=websecure
      - traefik.http.routers.langfuse.tls=true
      - traefik.http.services.langfuse.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # lens profile: LiteLLM Lens agent-trace analysis with its ClickHouse store
  # ---------------------------------------------------------------------------

  lens-preflight:
    logging: *default-logging
    profiles: [lens]
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        require_secret() {
          length=$$(printf '%s' "$$2" | wc -c)
          [ "$$length" -ge 32 ] && [ "$$length" -le 512 ] || { echo "Set $$1 in $$3 to 32-512 characters, for example with 'openssl rand -hex 32', to use the lens profile" >&2; exit 64; }
        }
        require_secret LENS_ADMIN_TOKEN "$$LENS_ADMIN_TOKEN" .env.optional
        require_secret LENS_CLICKHOUSE_PASSWORD "$$LENS_CLICKHOUSE_PASSWORD" .env.optional
        require_secret LITELLM_LENS_SERVICE_TOKEN "$$LITELLM_LENS_SERVICE_TOKEN" .env
        require_secret LENS_GATEWAY_SECRET "$$LENS_GATEWAY_SECRET" .env
        [ "$$LENS_ADMIN_TOKEN" != "$$LITELLM_LENS_SERVICE_TOKEN" ] && [ "$$LENS_ADMIN_TOKEN" != "$$LENS_GATEWAY_SECRET" ] && [ "$$LITELLM_LENS_SERVICE_TOKEN" != "$$LENS_GATEWAY_SECRET" ] || { echo "Use different values for LENS_ADMIN_TOKEN, LITELLM_LENS_SERVICE_TOKEN, and LENS_GATEWAY_SECRET" >&2; exit 64; }
        if [ -n "$$LENS_GATEWAY_API_BASE$$LENS_GATEWAY_API_KEY" ]; then
          [ -n "$$LENS_GATEWAY_API_BASE" ] && [ -n "$$LENS_GATEWAY_API_KEY" ] || { echo "Set both LENS_GATEWAY_API_BASE and LENS_GATEWAY_API_KEY in .env.optional, or neither" >&2; exit 64; }
        fi
    environment:
      LENS_ADMIN_TOKEN: ${LENS_ADMIN_TOKEN:-}
      LENS_CLICKHOUSE_PASSWORD: ${LENS_CLICKHOUSE_PASSWORD:-}
      LITELLM_LENS_SERVICE_TOKEN: ${LITELLM_LENS_SERVICE_TOKEN:-}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:-}
      LENS_GATEWAY_API_BASE: ${LENS_GATEWAY_API_BASE:-}
      LENS_GATEWAY_API_KEY: ${LENS_GATEWAY_API_KEY:-}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  lens-clickhouse:
    logging: *default-logging
    profiles: [lens]
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    user: "101:101"
    environment:
      CLICKHOUSE_DB: lens
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${LENS_CLICKHOUSE_PASSWORD:-}
      # Lens creates its own bounded read-only users for ad-hoc SQL.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./lens/clickhouse/config.d/keeper.xml:/etc/clickhouse-server/config.d/lens-keeper.xml:ro
      - ./lens/clickhouse/config.d/logging.xml:/etc/clickhouse-server/config.d/lens-logging.xml:ro
      - lens-clickhouse-data:/var/lib/clickhouse
    networks: [lens-storage]
    depends_on:
      lens-preflight:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy: *resources-database
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user lens --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  lens:
    logging: *default-logging
    profiles: [lens]
    # Lens publishes no release image yet, so the stack builds the pinned
    # release-candidate commit with the upstream runtime Dockerfile.
    image: litellm-lens:1.108.0-rc.1
    build:
      context: https://github.com/BerriAI/lens.git#b2ac5f8a289c3f77f02b81d67ca1ee075bfead6d
      dockerfile: deploy/runtime/Dockerfile
      target: runtime
      args:
        LENS_VERSION: 1.108.0-rc.1
        # The pinned commit's runtime base digest ships a ca-certificates-bundle
        # with a fixable Critical CVE, and its runtime stage does not upgrade
        # base packages. Use a newer Wolfi digest until the Lens pin moves past
        # upstream's fix (apk add --upgrade).
        LENS_RUNTIME_IMAGE: cgr.dev/chainguard/wolfi-base@sha256:24f549a7fcace88e69b9557941168c74645688ecc4acf7fb6d734a6b74e9019d
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-lens
        org.opencontainers.image.description: LiteLLM Lens agent-trace analysis service built from the pinned upstream release-candidate commit
        org.opencontainers.image.version: 1.108.0-rc.1
        org.opencontainers.image.base.name: cgr.dev/chainguard/wolfi-base
        org.opencontainers.image.source: https://github.com/BerriAI/lens
        org.opencontainers.image.url: https://github.com/BerriAI/lens
        org.opencontainers.image.revision: b2ac5f8a289c3f77f02b81d67ca1ee075bfead6d
        org.opencontainers.image.licenses: MIT
        # The Wolfi base would otherwise name Chainguard as the author.
        org.opencontainers.image.authors: BerriAI
    environment:
      LENS_MODE: standalone
      LENS_ADMIN_TOKEN: ${LENS_ADMIN_TOKEN:-}
      LENS_PUBLIC_URL: https://${LENS_HOST:?Set LENS_HOST in .env.optional}
      CLICKHOUSE_HOST: lens-clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${LENS_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: lens
      AGENT_TRACING_RETENTION_DAYS: "${LENS_TRACE_RETENTION_DAYS:-14}"
      # Gateway connection: LiteLLM authenticates to Lens with the service
      # token and signs each dashboard user's identity with the gateway secret.
      LITELLM_LENS_SERVICE_TOKEN: ${LITELLM_LENS_SERVICE_TOKEN:-}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:-}
      # Optional analysis models through a LiteLLM gateway. Calls to that
      # origin carry a signed Lens identity so the gateway keeps their message
      # content out of its logs and out of Lens.
      LENS_GATEWAY_API_BASE: ${LENS_GATEWAY_API_BASE:-}
      LENS_GATEWAY_API_KEY: ${LENS_GATEWAY_API_KEY:-}
      LENS_GATEWAY_URL: ${LENS_GATEWAY_API_BASE:-}
    depends_on:
      lens-preflight:
        condition: service_completed_successfully
      lens-clickhouse:
        condition: service_healthy
    networks: [edge, internal, lens-storage]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${LENS_TMP_SIZE:-1g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${LENS_CPU_LIMIT:-2}"
          memory: ${LENS_MEMORY_LIMIT:-2g}
          pids: ${LENS_PIDS_LIMIT:-128}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:4318/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.lens.rule=Host(`${LENS_HOST:?Set LENS_HOST in .env.optional}`)
      - traefik.http.routers.lens.entrypoints=websecure
      - traefik.http.routers.lens.tls=true
      - traefik.http.services.lens.loadbalancer.server.port=4318

  # ---------------------------------------------------------------------------
  # security profile: scheduled image scanning
  # ---------------------------------------------------------------------------

  image-security-docker-proxy:
    logging: *default-logging
    profiles: [security]
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [security-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy: *resources-tiny

  image-security-monitor:
    logging: *default-logging
    profiles: [security]
    image: litellm-image-security-monitor:0.1.0
    build:
      context: .
      dockerfile: security/image-monitor.Dockerfile
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-image-security-monitor
        org.opencontainers.image.description: Scheduled Trivy vulnerability scanning and SBOM generation for the running LiteLLM stack images
        org.opencontainers.image.version: "0.1.0"
        org.opencontainers.image.base.name: ghcr.io/astral-sh/uv:0.9.30-python3.13-bookworm-slim
    user: "${IMAGE_SECURITY_UID:-1000}:${IMAGE_SECURITY_GID:-1000}"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-litellm-stack}"
      TZ: "${STACK_TIMEZONE:-Europe/Berlin}"
      DOCKER_HOST: tcp://image-security-docker-proxy:2375
      IMAGE_SECURITY_STATE_DIR: /data/state
      IMAGE_SECURITY_REPORT_DIR: /data/reports
      IMAGE_SECURITY_METRICS_DIR: /data/metrics
      IMAGE_SECURITY_EXCEPTIONS_FILE: /app/security/exceptions.toml
      IMAGE_SECURITY_TRIVY_EXECUTABLE: /usr/local/bin/trivy
      IMAGE_SECURITY_SCHEDULE_HOUR: "${IMAGE_SECURITY_SCHEDULE_HOUR:-2}"
      IMAGE_SECURITY_SCHEDULE_MINUTE: "${IMAGE_SECURITY_SCHEDULE_MINUTE:-45}"
      IMAGE_SECURITY_RUN_ON_START: "${IMAGE_SECURITY_RUN_ON_START:-true}"
      IMAGE_SECURITY_SBOM_ENABLED: "${IMAGE_SECURITY_SBOM_ENABLED:-true}"
      IMAGE_SECURITY_SBOM_LICENCE_SCAN: "${IMAGE_SECURITY_SBOM_LICENCE_SCAN:-true}"
      IMAGE_SECURITY_SBOM_RETENTION_DAYS: "${IMAGE_SECURITY_SBOM_RETENTION_DAYS:-400}"
      # Container output already reaches the log collectors; the root is read-only.
      MAINTENANCE_FILE_LOGGING: "false"
    command: ["--all"]
    volumes:
      - ./security-state:/data/state
      - ./security-reports:/data/reports
      - ./security-metrics:/data/metrics
      - ./security/exceptions.toml:/app/security/exceptions.toml:ro
    depends_on:
      image-security-docker-proxy:
        condition: service_healthy
    networks: [security-monitor]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${IMAGE_SECURITY_CPU_LIMIT:-2}"
          memory: ${IMAGE_SECURITY_MEMORY_LIMIT:-2500m}
          pids: ${IMAGE_SECURITY_PIDS_LIMIT:-256}
    restart: ${IMAGE_SECURITY_RESTART_POLICY:-on-failure:5}
