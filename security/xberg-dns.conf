options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { localnets; };
    forwarders { 127.0.0.11; };
    forward only;
    max-cache-size 32m;
    # Docker's embedded forwarder does not expose the records required for validation.
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { any; };
};
