http_port 3128

# HTTPS only: plaintext HTTP would let an on-path attacker rewrite fetched
# content, which then enters model context as trusted tool output.
acl CONNECT method CONNECT
acl SSL_ports port 443
# -n: never reverse-resolve IP-literal destinations.
acl allowed_domains dstdomain -n "/etc/squid/xberg-egress-allowlist.txt"

acl blocked_ipv4 dst 0.0.0.0/8
acl blocked_ipv4 dst 10.0.0.0/8
acl blocked_ipv4 dst 100.64.0.0/10
acl blocked_ipv4 dst 127.0.0.0/8
acl blocked_ipv4 dst 169.254.0.0/16
acl blocked_ipv4 dst 172.16.0.0/12
acl blocked_ipv4 dst 192.0.0.0/24
acl blocked_ipv4 dst 192.168.0.0/16
acl blocked_ipv4 dst 198.18.0.0/15
acl blocked_ipv4 dst 224.0.0.0/4
acl blocked_ipv4 dst 240.0.0.0/4
acl blocked_ipv6 dst ::/128
acl blocked_ipv6 dst ::1/128
acl blocked_ipv6 dst fc00::/7
acl blocked_ipv6 dst fe80::/10

# Order matters: the name-only allowlist check runs before the dst ACLs,
# which resolve DNS, so denied hostnames are never looked up.
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !allowed_domains
http_access deny blocked_ipv4
http_access deny blocked_ipv6
http_access allow allowed_domains
http_access deny all

pinger_enable off
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
