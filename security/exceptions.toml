version = 1

# Add narrowly scoped, time-limited exceptions only after reviewing a finding.
#
# [[exceptions]]
# service = "litellm-prod"
# vulnerability = "CVE-YYYY-NNNN"
# package = "package-name"
# installed_version = "1.2.3"
# expires = "2026-12-31"
# reason = "Vulnerable code path is unreachable; upstream fix is pending."
# reviewed_by = "operator-name"

# Reviewed 2026-11-23 from the image-security scan. No upstream image fixes
# these findings yet; remove each entry once a fixed image is pinned.

# PostgreSQL images: gosu entrypoint helper.

[[exceptions]]
service = "postgres"
vulnerability = "CVE-2025-68121"
package = "stdlib"
installed_version = "v1.24.6"
expires = "2027-02-28"
reason = "gosu is built with Go stdlib 1.24.6. It only drops privileges once at container start and makes no TLS connections, so the crypto/tls flaw is unreachable. Current upstream postgres 16.16-alpine3.24 and 17.12 rebuilds still ship this gosu."
reviewed_by = "pi-dotcom"

