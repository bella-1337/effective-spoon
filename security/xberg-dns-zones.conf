// Xberg sandbox resolver: deny by default.
//
// The authoritative empty root answers NXDOMAIN locally for every name, so a
// lookup for an attacker-controlled hostname never leaves the sandbox. Each
// allowlisted destination is delegated in xberg-dns-deny-root.zone and
// forwarded upstream here. Include every CNAME target of an allowlisted name.
// Keep this list aligned with xberg-egress-allowlist.txt and xberg-config.toml.
include "/etc/bind/named.conf.options";

zone "." {
    type primary;
    file "/etc/bind/xberg-deny-root.zone";
};

zone "docs.xberg.io" {
    type forward;
    forward only;
    forwarders { 127.0.0.11; };
};

// CNAME target of docs.xberg.io (GitHub Pages).
zone "xberg-io.github.io" {
    type forward;
    forward only;
    forwarders { 127.0.0.11; };
};
