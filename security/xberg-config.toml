# GENERATED from security/xberg-destinations.toml by
# `python3 scripts/maintenance.py xberg-allowlist render`. Do not edit:
# change the source file and run `xberg-allowlist apply`.
#
# Xberg extracts untrusted, caller-chosen inputs. Local paths and file:// URIs
# would expose the container filesystem to any MCP caller or injected prompt,
# so only uploaded bytes and allowlisted remote URLs are accepted.
#
# Xberg permits an allowlisted hostname before its built-in private-range
# check, so the Squid proxy's destination-address ACLs are what keep an
# allowlisted name from reaching a private address.
[url]
allow_local_file_inputs = false
allow_file_uris = false

[url.crawl.ssrf]
# exact: only that host. suffix ".host": the host and its subdomains.
allowlist = [
  { type = "exact", value = "docs.xberg.io" },
]
