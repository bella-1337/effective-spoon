# GitLab CI/CD entry point for the LiteLLM stack.
#
# The jobs live in .gitlab/ci/ and mirror .github/workflows/ one file per
# workflow; both platforms run the same scripts under scripts/ci/ with the same
# digest-pinned tool images. Runner and project setup:
# docs/development-workflow.md#gitlab-runner-and-project-setup

include:
  - local: .gitlab/ci/images.yml
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/supply-chain.yml
  - local: .gitlab/ci/devcontainer.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/docs.yml

variables:
  MAINTENANCE_FILE_LOGGING: "false"
  # Publish the documentation site to GitLab Pages from the default branch and
  # release tags. A project CI/CD variable set to "false" overrides this.
  DOCS_PAGES_ENABLED: "true"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  # A branch push starts a pipeline only on the default branch; other branches
  # are tested by their merge request pipeline, so they never run twice.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - validate
  - supply-chain
  - release

default:
  interruptible: true
