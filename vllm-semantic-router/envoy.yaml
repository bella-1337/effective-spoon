static_resources:
  listeners:
    - name: routed-inference
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8899
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: routed_inference
                route_config:
                  name: routed_inference
                  virtual_hosts:
                    - name: litellm
                      domains: ["*"]
                      request_headers_to_remove:
                        - x-selected-model
                        - x-vsr-selected-model
                        - x-vllm-sr-selected-model
                        - x-vsr-looper-request
                        - x-vsr-looper-secret
                        - x-vsr-looper-decision
                        - x-vsr-looper-iteration
                        - x-authz-user-id
                        - x-authz-user-groups
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: litellm_dev
                            timeout: 120s
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: semantic_router_ingress
                      token_bucket:
                        max_tokens: 2000
                        tokens_per_fill: 1000
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: semantic_router_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: semantic_router_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-local-rate-limit
                            value: "true"
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request_handle)
                            local request_headers = request_handle:headers()
                            request_headers:remove("x-selected-model")
                            request_headers:remove("x-vsr-selected-model")
                            request_headers:remove("x-vllm-sr-selected-model")
                            request_headers:remove("x-vsr-looper-request")
                            request_headers:remove("x-vsr-looper-secret")
                            request_headers:remove("x-vsr-looper-decision")
                            request_headers:remove("x-vsr-looper-iteration")
                            request_headers:remove("x-authz-user-id")
                            request_headers:remove("x-authz-user-groups")
                            local authorization = request_headers:get("authorization")
                            if authorization == nil or authorization == "" then
                              request_handle:respond(
                                {[":status"] = "401", ["content-type"] = "application/json"},
                                "{\"error\":{\"message\":\"Authentication required\",\"type\":\"authentication_error\"}}"
                              )
                              return
                            end

                            local ok, response_headers = pcall(function()
                              return request_handle:httpCall(
                                "litellm_dev",
                                {
                                  [":method"] = "GET",
                                  [":path"] = "/v1/models",
                                  [":authority"] = "litellm-dev",
                                  ["authorization"] = authorization
                                },
                                "",
                                5000
                              )
                            end)
                            if not ok then
                              request_handle:logErr("LiteLLM authentication check failed: " .. tostring(response_headers))
                              request_handle:respond(
                                {[":status"] = "503", ["content-type"] = "application/json"},
                                "{\"error\":{\"message\":\"Authentication service unavailable\",\"type\":\"service_unavailable\"}}"
                              )
                              return
                            end

                            local status = response_headers[":status"]
                            if status ~= "200" then
                              local response_status = "503"
                              local message = "Authentication service unavailable"
                              local error_type = "service_unavailable"
                              if status == "401" or status == "403" then
                                response_status = "401"
                                message = "Invalid credentials"
                                error_type = "authentication_error"
                              end
                              request_handle:respond(
                                {[":status"] = response_status, ["content-type"] = "application/json"},
                                "{\"error\":{\"message\":\"" .. message .. "\",\"type\":\"" .. error_type .. "\"}}"
                              )
                            end
                          end
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: semantic_router
                      allow_mode_override: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      failure_mode_allow: false
                      message_timeout: 120s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
                request_timeout: 120s
                stream_idle_timeout: 120s
    - name: prometheus-metrics
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: prometheus_metrics
                route_config:
                  name: prometheus_metrics
                  virtual_hosts:
                    - name: envoy_metrics
                      domains: ["*"]
                      routes:
                        - match:
                            path: /stats/prometheus
                          route:
                            cluster: envoy_admin
                            timeout: 5s
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true

  clusters:
    - name: semantic_router
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: semantic_router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: vllm-semantic-router
                      port_value: 50051
    - name: litellm_dev
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: litellm_dev
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: litellm-dev
                      port_value: 4000
    - name: envoy_admin
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: envoy_admin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 19000

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 19000
