version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /opensearch/tools
      - /pgvector
      - /security
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: pip
    directory: /opensearch/tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - documentation

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - devcontainer
