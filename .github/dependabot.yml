version: 2
# Every entry waits seven days before proposing a new release, so a
# compromised or quickly withdrawn upstream version is not picked up at once.
# Security updates ignore the cooldown. The labels must exist in the
# repository (Dependabot skips missing ones); see
# docs/development-workflow.md#repository-settings.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Image pins in docker-compose.yml, compose.optional.yml, and the remote
  # GPU host's compose.yml. The plain `docker` ecosystem reads only
  # Dockerfiles, so Compose files need their own entry.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /gpu-host
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - containers
    ignore:
      # LiteLLM follows the LTS (prod) and nightly (dev) channels through
      # docs/upgrades-and-rollback.md, and the litellm-* images are built
      # locally, so there is nothing upstream to compare them with.
      - dependency-name: "*litellm*"
      # A major version of a stateful or pinned-format service (PostgreSQL,
      # OpenSearch, ClickHouse, Redis, Grafana) needs a planned migration.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Components that must run the same version move together.
      opensearch:
        patterns:
          - "opensearchproject/opensearch*"
      langfuse:
        patterns:
          - "*langfuse*"
      presidio:
        patterns:
          - "*presidio*"

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /opensearch/tools
      - /security
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /pgvector
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - containers
    ignore:
      # litellm-pgvector is validated on Python 3.11. Keep patch and digest
      # updates automatic without jumping to a newer interpreter series.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: pip
    directory: /opensearch/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /docs-site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - documentation

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - devcontainer
