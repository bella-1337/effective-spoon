name: Release

# A manual run must select the release tag itself under "Use workflow from"
# (`gh workflow run release.yml --ref v1.2.3`), so the checks run on the
# commit that is published. The `release` environment admits only v*.*.* tags.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a run that is not on a semantic-version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! printf '%s\n' "$REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Run the Release workflow on a vMAJOR.MINOR.PATCH tag, not $REF_TYPE $REF_NAME."
            exit 1
          fi

  validate:
    needs: release-tag
    uses: ./.github/workflows/validate.yml

  supply-chain:
    needs: release-tag
    uses: ./.github/workflows/supply-chain.yml
    with:
      enforce: true

  publish:
    needs: [validate, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release bundle
        run: ./scripts/ci/release-bundle.sh "$RELEASE_TAG" dist

      # Artifact attestations need a public repository or GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/litellm-stack-${{ env.RELEASE_TAG }}.tar.gz

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/litellm-stack-${RELEASE_TAG}.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "LiteLLM stack ${RELEASE_TAG}"
