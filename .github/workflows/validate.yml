name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run hermetic validation
        run: ./scripts/ci/validate.sh

      - name: Lint shell scripts
        run: |
          docker run --rm \
            --entrypoint shellcheck \
            --volume "$PWD:/repo:ro" \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            /repo/scripts/ci/validate.sh \
            /repo/.devcontainer/post-create.sh

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

      - name: Record deferred external-service checks
        if: always()
        run: |
          {
            echo "### External-service checks"
            echo
            echo "Deferred by design: full Compose startup, GPU model loading,"
            echo "provider API calls, vulnerability-database downloads, and"
            echo "live on-prem deployment probes."
          } >> "$GITHUB_STEP_SUMMARY"

  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build development container
        run: npx --yes @devcontainers/cli@0.89.0 build --workspace-folder .
