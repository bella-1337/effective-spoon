<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The LiteLLM stack in three layers</title>
  <desc id="hero-desc">Clients reach the edge layer (Traefik), requests pass to the gateway layer (LiteLLM with Presidio and tools) and out to model providers, and telemetry flows down to the data layer (PostgreSQL and OpenSearch).</desc>
  <defs>
    <pattern id="grid" width="26.5" height="26.5" patternUnits="userSpaceOnUse">
      <path d="M26.5 0H0V26.5" fill="none" stroke="#94a3b8" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <linearGradient id="face-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="face-gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75" stop-opacity=".7"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="face-data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; letter-spacing: .14em; font-weight: 700; }
    .label { font-size: 12.5px; fill: #cbd5e1; }
    .muted { font-size: 11px; fill: #64748b; letter-spacing: .08em; }
    .edge-line { stroke-width: 1.4; fill: none; vector-effect: non-scaling-stroke; }
    .flow { stroke-dasharray: 5 6; animation: flow 1.6s linear infinite; }
    .flow-slow { stroke-dasharray: 2 6; animation: flow 2.8s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-2 { animation-delay: -1.3s; }
    .packet { animation: journey 5.2s cubic-bezier(.45, 0, .55, 1) infinite; }
    .packet-2 { animation-delay: -1.73s; }
    .packet-3 { animation-delay: -3.46s; }
    .telemetry { animation: sink 2.4s ease-in infinite; }
    .telemetry-2 { animation-delay: -1.2s; }
    .beam { animation: shimmer 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes shimmer { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes journey {
      0% { transform: translate(0, 0); opacity: 0; }
      5% { opacity: 1; }
      24% { transform: translate(115px, 19.5px); }
      38% { transform: translate(190px, 57px); }
      58% { transform: translate(190px, 157px); }
      78% { transform: translate(40px, 157px); }
      95% { opacity: 1; }
      100% { transform: translate(-15px, 235px); opacity: 0; }
    }
    @keyframes sink {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(0, 100px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .flow-slow, .pulse, .beam, .telemetry { animation: none; }
      .packet { animation: none; opacity: 0; }
    }
  </style>

  <!-- Clients, outside the stack -->
  <g transform="translate(46 38)">
    <rect x="-30" y="-17" width="60" height="34" rx="8" fill="#0b1324" stroke="#22d3ee" stroke-opacity=".7"/>
    <circle cx="-15" cy="0" r="3.2" fill="#22d3ee"/>
    <circle cx="0" cy="0" r="3.2" fill="#22d3ee" fill-opacity=".7"/>
    <circle cx="15" cy="0" r="3.2" fill="#22d3ee" fill-opacity=".45"/>
    <text class="muted" x="-30" y="-24">CLIENTS</text>
  </g>

  <!-- Providers, outside the stack -->
  <g transform="translate(45 300)">
    <rect x="-34" y="-17" width="68" height="34" rx="8" fill="#0b1324" stroke="#94a3b8" stroke-opacity=".6"/>
    <path d="M-14 4a7 7 0 0 1 2-13 9 9 0 0 1 17 2 6 6 0 0 1 1 11Z" fill="none" stroke="#e2e8f0" stroke-opacity=".8" stroke-width="1.4"/>
    <text class="muted" x="-34" y="31">PROVIDERS</text>
    <text class="muted" x="-34" y="45">GPU HOST</text>
  </g>

  <!-- Data and telemetry layer (bottom) -->
  <g transform="translate(250 305)">
    <polygon points="-150,0 0,75 0,89 -150,14" fill="#1e1b4b"/>
    <polygon points="0,75 150,0 150,14 0,89" fill="#2e1065"/>
    <g transform="scale(1 .5) rotate(45)">
      <rect x="-106" y="-106" width="212" height="212" fill="url(#face-data)" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <rect x="-106" y="-106" width="212" height="212" fill="url(#grid)"/>
      <path class="edge-line flow-slow" stroke="#a78bfa" d="M0 0L-55-30M0 0L45 35M0 0L-25 62"/>
      <circle cx="-55" cy="-30" r="11" fill="#a78bfa" filter="url(#glow)" class="pulse"/>
      <circle cx="45" cy="35" r="11" fill="#c4b5fd" filter="url(#glow)" class="pulse pulse-2"/>
      <circle cx="-25" cy="62" r="7" fill="#f472b6" filter="url(#glow)" class="pulse"/>
      <circle cx="0" cy="0" r="6" fill="#ede9fe"/>
    </g>
  </g>

  <!-- Telemetry beam: gateway to data -->
  <rect class="beam" x="248.5" y="210" width="3" height="96" fill="url(#beam)"/>

  <!-- Gateway layer (middle) -->
  <g transform="translate(250 205)">
    <polygon points="-150,0 0,75 0,89 -150,14" fill="#0c3a47"/>
    <polygon points="0,75 150,0 150,14 0,89" fill="#083344"/>
    <g transform="scale(1 .5) rotate(45)">
      <rect x="-106" y="-106" width="212" height="212" fill="url(#face-gateway)" stroke="#22d3ee" stroke-opacity=".85" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <rect x="-106" y="-106" width="212" height="212" fill="url(#grid)"/>
      <path class="edge-line flow" stroke="#22d3ee" d="M0 0L-60 40M0 0L55-48M0 0L62 50M0 0L-45-58"/>
      <circle cx="-60" cy="40" r="9" fill="#fb7185" filter="url(#glow)" class="pulse"/>
      <circle cx="55" cy="-48" r="9" fill="#34d399" filter="url(#glow)" class="pulse pulse-2"/>
      <circle cx="62" cy="50" r="9" fill="#34d399" filter="url(#glow)" class="pulse"/>
      <circle cx="-45" cy="-58" r="8" fill="#fbbf24" filter="url(#glow)" class="pulse pulse-2"/>
      <circle cx="0" cy="0" r="17" fill="#22d3ee" fill-opacity=".25" class="pulse"/>
      <circle cx="0" cy="0" r="10" fill="#67e8f9" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Request beam: edge to gateway -->
  <rect class="beam" x="248.5" y="110" width="3" height="96" fill="url(#beam)"/>

  <!-- Edge layer (top) -->
  <g transform="translate(250 105)">
    <polygon points="-150,0 0,75 0,89 -150,14" fill="#3b2410"/>
    <polygon points="0,75 150,0 150,14 0,89" fill="#2a1a0b"/>
    <g transform="scale(1 .5) rotate(45)">
      <rect x="-106" y="-106" width="212" height="212" fill="url(#face-edge)" stroke="#fbbf24" stroke-opacity=".8" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <rect x="-106" y="-106" width="212" height="212" fill="url(#grid)"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#fbbf24" stroke-opacity=".5" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
      <circle cx="0" cy="0" r="10" fill="#fcd34d" filter="url(#glow)" class="pulse"/>
    </g>
  </g>

  <!-- Paths that leave the stack -->
  <path class="edge-line flow" stroke="#22d3ee" stroke-opacity=".75" d="M76 47L175 67.5L250 105"/>
  <path class="edge-line flow" stroke="#94a3b8" stroke-opacity=".75" d="M250 205L100 205L45 283"/>
  <path class="edge-line flow-slow" stroke="#fb923c" stroke-opacity=".7" d="M250 210V300"/>

  <!-- A request travelling clients, edge, gateway, providers -->
  <g filter="url(#glow)">
    <circle class="packet" cx="60" cy="48" r="4" fill="#e0f2fe"/>
    <circle class="packet packet-2" cx="60" cy="48" r="4" fill="#e0f2fe"/>
    <circle class="packet packet-3" cx="60" cy="48" r="4" fill="#e0f2fe"/>
    <circle class="telemetry" cx="250" cy="210" r="3" fill="#fdba74"/>
    <circle class="telemetry telemetry-2" cx="250" cy="210" r="3" fill="#fdba74"/>
  </g>

  <!-- Layer labels -->
  <g>
    <path d="M400 105H424" stroke="#fbbf24" stroke-opacity=".6"/>
    <text x="432" y="99" class="eyebrow" fill="#fbbf24">EDGE</text>
    <text x="432" y="117" class="label">Traefik · TLS</text>

    <path d="M400 205H424" stroke="#22d3ee" stroke-opacity=".6"/>
    <text x="432" y="199" class="eyebrow" fill="#22d3ee">GATEWAY</text>
    <text x="432" y="217" class="label">LiteLLM · Presidio</text>
    <text x="432" y="233" class="label">SearXNG · Xberg</text>

    <path d="M400 305H424" stroke="#a78bfa" stroke-opacity=".6"/>
    <text x="432" y="299" class="eyebrow" fill="#a78bfa">DATA &amp; TELEMETRY</text>
    <text x="432" y="317" class="label">PostgreSQL · pgvector</text>
    <text x="432" y="333" class="label">OpenSearch · Alloy</text>
  </g>
</svg>
