# Mirrors .github/workflows/supply-chain.yml: runs when image inputs change,
# on schedules and manual pipelines, and on tags.

.supply-chain-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - .dockerignore
        - .env.example
        - .env.optional.example
        - compose.optional.yml
        - docker-compose.yml
        - docs-site/requirements.txt
        - grafana/alerting/**/*
        - opensearch/tools/**/*
        - pgvector/**/*
        - scripts/ci/**/*
        - scripts/generate-image-sbom.py
        - scripts/maintenance_common.py
        - scripts/maintenance_contracts.py
        - scripts/monitor-image-vulnerabilities.py
        - scripts/run-image-security-scheduler.py
        - security/**/*

image-scan:
  extends:
    - .docker-in-docker
    - .supply-chain-rules
  stage: supply-chain
  needs: []
  timeout: 45m
  before_script:
    - apk add --no-cache python3
    - sh scripts/ci/wait-for-docker.sh
  script:
    - python3 scripts/ci/images.py build
    # Merge requests and branch pushes report; schedules, manual runs, and
    # tags fail on unexcepted KEV or fixable Critical findings.
    - |
      if [ -z "${CI_COMMIT_TAG:-}" ] && { [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] || [ "$CI_PIPELINE_SOURCE" = "push" ]; }; then
        python3 scripts/ci/images.py scan --report-only
      else
        python3 scripts/ci/images.py scan
      fi

dependency-scan:
  extends: .supply-chain-rules
  stage: supply-chain
  image:
    name: ${TRIVY_IMAGE}
    entrypoint: [""]
  needs: []
  timeout: 15m
  script:
    - sh scripts/ci/static-checks.sh dependencies
