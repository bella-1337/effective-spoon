# Mirrors .github/workflows/docs.yml: every pipeline builds the versioned
# documentation site; the default branch and release tags publish it to
# GitLab Pages when the CI/CD variable DOCS_PAGES_ENABLED is "true". The
# `pages` job refuses to publish when the current site answers anonymous
# visitors. Setup: docs/documentation-site.md#gitlab-pages

.docs:
  image:
    name: ${DOCS_IMAGE}
    entrypoint: [""]
  needs: []
  timeout: 30m
  variables:
    GIT_DEPTH: "0"
    MAINTENANCE_FILE_LOGGING: "false"
    UV_CACHE_DIR: .docs-cache/uv
  cache:
    key:
      prefix: docs
      files:
        - docs-site/requirements.txt
    paths:
      - .docs-cache/
  before_script:
    # The site has "dev" from the default branch and one version per release
    # tag; a pipeline checkout fetches neither by default.
    - git fetch --quiet --force --tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"

docs:
  extends: .docs
  stage: validate
  rules:
    # The pages job builds the same site on these pipelines.
    - if: $DOCS_PAGES_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $DOCS_PAGES_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: never
    - when: on_success
  script:
    - sh scripts/ci/docs.sh check

pages:
  extends: .docs
  stage: release
  interruptible: false
  resource_group: pages
  rules:
    - if: $DOCS_PAGES_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $DOCS_PAGES_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - python3 scripts/build-docs.py verify-private "$CI_PAGES_URL"
    - sh scripts/ci/docs.sh publish "$CI_PAGES_URL"
  artifacts:
    paths:
      - public
    expire_in: 7 days
