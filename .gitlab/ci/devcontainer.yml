# Mirrors .github/workflows/devcontainer.yml: proves that .devcontainer/ still
# builds when it changes, on schedules, and on manual pipelines.

devcontainer:
  extends: .docker-in-docker
  stage: supply-chain
  needs: []
  timeout: 20m
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - .devcontainer/**/*
        - .gitlab/ci/devcontainer.yml
        - .gitlab/ci/templates.yml
  before_script:
    - apk add --no-cache nodejs npm
    - sh scripts/ci/wait-for-docker.sh
  script:
    - npx --yes @devcontainers/cli@0.89.0 build --workspace-folder .
