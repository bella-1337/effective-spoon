# Mirrors .github/workflows/release.yml: a semantic-version tag pipeline runs
# every check, then offers this manual job. Protect the `release` environment
# to restrict who may start it.

publish-release:
  stage: release
  image:
    name: ${GLAB_IMAGE}
    entrypoint: [""]
  needs:
    - validate
    - lint-shell
    - lint-dockerfiles
    - job: lint-github-workflows
      optional: true
    - secret-scan
    - image-scan
    - dependency-scan
  timeout: 15m
  interruptible: false
  resource_group: release
  environment:
    name: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
  before_script:
    - apk add --no-cache curl
  script:
    - sh scripts/ci/gitlab-publish-release.sh
  # The `release:` keyword runs glab from GLAB_IMAGE; it needs GitLab 18.0+.
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: LiteLLM stack ${CI_COMMIT_TAG}
    description: >-
      Validated source bundle for LiteLLM stack ${CI_COMMIT_TAG}. Verify the
      download with SHA256SUMS and deploy it with the upgrade and rollback
      procedure in docs/upgrades-and-rollback.md.
    assets:
      links:
        - name: litellm-stack-${CI_COMMIT_TAG}.tar.gz
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/litellm-stack/${CI_COMMIT_TAG}/litellm-stack-${CI_COMMIT_TAG}.tar.gz
          link_type: package
        - name: SHA256SUMS
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/litellm-stack/${CI_COMMIT_TAG}/SHA256SUMS
          link_type: other
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
