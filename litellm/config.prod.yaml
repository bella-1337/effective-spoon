include:
  - modules/search.yaml
  - modules/guardrails/presidio.yaml
  - modules/policies/eu-data-protection.yaml

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

mcp_servers:
  xberg:
    url: http://xberg:8001/mcp
    transport: http
    description: Internal Xberg document and website extraction server
    allowed_tools:
      - extract
      - detect_mime_type
      - get_version
      - list_formats

litellm_settings:
  drop_params: true
  request_timeout: 120
  turn_off_message_logging: true
  store_audit_logs: true
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: 180d
  maximum_health_check_retention_period: 7d
  maximum_spend_logs_cleanup_cron: "0 4 * * *"
