{{- if .Values.prometheus.nodeExporter.enabled }}
{{- /*
node-exporter reads the node, so it needs a DaemonSet with host mounts. Upstream
ran it beside the Compose stack; here it is opt-in because the cluster usually
already runs one.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm-stack.serviceHost" (dict "context" $root "component" "node-exporter") }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "litellm-stack.componentLabels" (dict "context" $root "component" "node-exporter") | nindent 4 }}
spec:
  selector:
    {{- include "litellm-stack.componentSelectorLabels" (dict "context" $root "component" "node-exporter") | nindent 4 }}
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "litellm-stack.serviceHost" (dict "context" $root "component" "node-exporter") }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "litellm-stack.componentLabels" (dict "context" $root "component" "node-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "litellm-stack.componentSelectorLabels" (dict "context" $root "component" "node-exporter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm-stack.componentLabels" (dict "context" $root "component" "node-exporter") | nindent 8 }}
    spec:
      {{- include "litellm-stack.imagePullSecrets" $root | nindent 6 }}
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-exporter
          image: {{ include "litellm-stack.image" (dict "context" $root "image" $root.Values.images.nodeExporter) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          args:
            - --path.rootfs=/host
            - --collector.textfile.directory=/textfile
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile
              mountPath: /textfile
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.prometheus.nodeExporter.resources | nindent 12 }}
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: textfile
          # Populated by the security profile's scanner, which writes Prometheus
          # textfiles the way upstream wrote security-metrics/.
          emptyDir: {}
      tolerations:
        - operator: Exists
          effect: NoSchedule
{{- end }}
{{- end }}
