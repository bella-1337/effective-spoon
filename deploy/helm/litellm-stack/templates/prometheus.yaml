---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm-stack.serviceHost" (dict "context" $root "component" "blackbox") }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "litellm-stack.componentLabels" (dict "context" $root "component" "blackbox") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "litellm-stack.componentSelectorLabels" (dict "context" $root "component" "blackbox") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm-stack.componentLabels" (dict "context" $root "component" "blackbox") | nindent 8 }}
    spec:
      {{- include "litellm-stack.imagePullSecrets" $root | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox
          image: {{ include "litellm-stack.image" (dict "context" $root "image" $root.Values.images.blackboxExporter) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9115
          securityContext:
            allowPrivilegeEscalation: false
            # Only the http_2xx module is used; ICMP probing is not required.
            capabilities:
              drop: ["ALL", "NET_RAW"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
