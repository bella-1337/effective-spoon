{{- /*
Credential Secret.

Rendered only when no existing Secret is supplied. Values already present in the
cluster are preserved across upgrades through `lookup`, so a `helm upgrade` never
silently rotates a password the running pods and PVCs still expect. Blank values
are generated when secrets.generateMissing is true.

Formats follow the upstream .env.example validation rules:
  - OpenSearch passwords: at least 16 URL-safe characters.
  - OPENSEARCH_DATASOURCES_MASTER_KEY: exactly 32 characters.
  - LANGFUSE_ENCRYPTION_KEY: exactly 64 hexadecimal characters.
  - LITELLM_MASTER_KEY: sk- prefixed.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "litellm-stack.fullname" .) -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existing := dict -}}
{{- if $secret -}}
{{- $existing = $secret.data | default dict -}}
{{- end -}}

{{- $values := .Values.secrets.values -}}
{{- $resolved := dict -}}
{{- range $key, $value := $values -}}
{{- if $value -}}
{{- $_ := set $resolved $key ($value | b64enc) -}}
{{- else if hasKey $existing $key -}}
{{- $_ := set $resolved $key (index $existing $key) -}}
{{- else if $.Values.secrets.generateMissing -}}
{{- $_ := set $resolved $key (include "litellm-stack.generateSecret" (dict "key" $key "context" $)) -}}
{{- end -}}
{{- end -}}

{{- /* Mirror the upstream lens-preflight secret checks before they reach a pod. */ -}}
{{- $lensAdmin := index $resolved "LENS_ADMIN_TOKEN" | default "" -}}
{{- $lensService := index $resolved "LITELLM_LENS_SERVICE_TOKEN" | default "" -}}
{{- $lensGateway := index $resolved "LENS_GATEWAY_SECRET" | default "" -}}
{{- if and $lensService $lensGateway (eq $lensService $lensGateway) -}}
{{- fail "LITELLM_LENS_SERVICE_TOKEN and LENS_GATEWAY_SECRET must be different secrets" -}}
{{- end -}}
{{- if and $lensAdmin $lensService (eq $lensAdmin $lensService) -}}
{{- fail "LENS_ADMIN_TOKEN must differ from LITELLM_LENS_SERVICE_TOKEN" -}}
{{- end -}}
{{- if and $lensAdmin $lensGateway (eq $lensAdmin $lensGateway) -}}
{{- fail "LENS_ADMIN_TOKEN must differ from LENS_GATEWAY_SECRET" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-stack.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret if the release is uninstalled: the PVCs it protects
    # outlive the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $values }}
  {{- if hasKey $resolved $key }}
  {{ $key }}: {{ index $resolved $key | quote }}
  {{- end }}
  {{- end }}
{{- end }}
