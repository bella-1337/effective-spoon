{{- /*
SearXNG search backend.

Internal-only: reachable by the gateways' searxng-search tool and by Prometheus
blackbox, never routed publicly. Upstream mounted ./searxng read-write because
the container rewrites its settings directory; here the settings file is a
read-only ConfigMap subPath and the mutable state goes to an emptyDir.
*/ -}}
{{- $secret := include "litellm-stack.secretName" . -}}
{{- $component := "searxng" -}}
{{- if .Values.searxng.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm-stack.serviceHost" (dict "context" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-stack.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "litellm-stack.componentSelectorLabels" (dict "context" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm-stack.serviceHost" (dict "context" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-stack.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.searxng.replicaCount }}
  selector:
    matchLabels:
      {{- include "litellm-stack.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm-stack.componentLabels" (dict "context" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      {{- include "litellm-stack.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: {{ include "litellm-stack.image" (dict "context" . "image" .Values.images.searxng) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: SEARXNG_BASE_URL
              value: http://{{ include "litellm-stack.serviceHost" (dict "context" . "component" $component) }}:8080/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            # The image writes its cache and generated files under /etc/searxng.
            - name: state
              mountPath: /var/cache/searxng
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # The upstream image starts as root to chown and then drops.
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID"]
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
      volumes:
        - name: settings
          configMap:
            name: {{ include "litellm-stack.fullname" . }}-searxng
        - name: state
          emptyDir: {}
      {{- include "litellm-stack.nodeSelector" (dict "context" . "component" .Values.searxng) | nindent 6 }}
      {{- include "litellm-stack.tolerations" (dict "context" . "component" .Values.searxng) | nindent 6 }}
      {{- include "litellm-stack.affinity" (dict "context" . "component" .Values.searxng) | nindent 6 }}
{{- end }}
