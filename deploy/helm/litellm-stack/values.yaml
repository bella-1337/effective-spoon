# -----------------------------------------------------------------------------
# Secrets
#
# Leave existingSecret empty to let the chart render one Secret from
# secrets.values. Values left blank are generated on first install and reused on
# upgrade. A non-empty existingSecret wins and this block is ignored, which is
# the recommended production path (External Secrets, Vault, SOPS).
# -----------------------------------------------------------------------------
secrets:
  existingSecret: ""
  generateMissing: true
  values:
    PG_PASSWORD: ""
    OPENSEARCH_DATABASE_PASSWORD: ""
    PG_EXPORTER_PASSWORD: ""
    PG_VECTOR_PASSWORD: ""
    PG_VECTOR_EXPORTER_PASSWORD: ""
    PG_VECTOR_API_KEY: ""
    QDRANT_API_KEY: ""
    LITELLM_MASTER_KEY: ""
    OPENAI_API_KEY: ""
    D3_DECISION_API_KEY: ""
    BGE_M3_API_KEY: ""
    OPENSEARCH_ADMIN_PASSWORD: ""
    OPENSEARCH_DASHBOARDS_SERVER_PASSWORD: ""
    OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD: ""
    OPENSEARCH_INGEST_PASSWORD: ""
    OPENSEARCH_BRIDGE_PASSWORD: ""
    OPENSEARCH_DATASOURCES_MASTER_KEY: ""
    OPENSEARCH_SESSION_ID_SALT: ""
    SEARXNG_SECRET: ""
    # Optional integrations; blank keeps them disabled.
    LANGFUSE_PUBLIC_KEY: ""
    LANGFUSE_SECRET_KEY: ""
    LANGFUSE_USER_ID_SALT: ""
    LITELLM_LENS_SERVICE_TOKEN: ""
    LENS_GATEWAY_SECRET: ""
    # grafana profile
    GRAFANA_ADMIN_PASSWORD: ""
    GRAFANA_SECURITY_SECRET_KEY: ""
    GRAFANA_DATABASE_PASSWORD: ""
    # langfuse profile
    LANGFUSE_POSTGRES_PASSWORD: ""
    LANGFUSE_CLICKHOUSE_PASSWORD: ""
    LANGFUSE_REDIS_AUTH: ""
    LANGFUSE_MINIO_PASSWORD: ""
    LANGFUSE_NEXTAUTH_SECRET: ""
    LANGFUSE_SALT: ""
    LANGFUSE_ENCRYPTION_KEY: ""
    LANGFUSE_INIT_USER_EMAIL: ""
    LANGFUSE_INIT_USER_NAME: ""
    LANGFUSE_INIT_USER_PASSWORD: ""
    # lens profile
    LENS_ADMIN_TOKEN: ""
    LENS_CLICKHOUSE_PASSWORD: ""
    LENS_GATEWAY_API_KEY: ""

# -----------------------------------------------------------------------------
# Ingress (replaces the upstream Traefik container)
#
# The chart does not deploy an edge proxy. It renders Ingress resources instead,
# so the cluster's own ingress controller terminates TLS and applies the
# security headers and rate limits through annotations.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # Mirrors the upstream edge-security-headers middleware.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=86400";
    # Mirrors the upstream edge-rate-limit middleware.
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "4"
  # TLS for every host below. Provide the certificate Secret out of band, or
  # annotate the Ingress for cert-manager in ingress.annotations.
  tls:
    enabled: true
    secretName: litellm-stack-tls
  hosts:
    litellmProd: ""
    litellmDev: ""
    opensearchDashboards: ""
    grafana: ""
    langfuse: ""
    langfuseS3: ""
    lens: ""

# -----------------------------------------------------------------------------
# prod profile: the production LiteLLM gateway (core, always on)
# -----------------------------------------------------------------------------
litellmProd:
  enabled: true
  replicaCount: 2
  host: ""
  # Upstream resource tier: one CPU and 4g per worker.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread: true
  # Proxy behavior; mirrors .env.example.
  storeModelInDB: true
  useV2MigrationResolver: false
  otelV2: true
  otelTraceExporter: otlp_grpc
  otelCaptureMessageContent: no_content
  forwardedAllowIps: "*"
  requestTimeout: 120
  # Remote GPU host on the separate gpu-host stack (D3-mini decisions model).
  d3DecisionApiBase: ""
  # Branding assets served by the gateway; see files/branding.
  branding:
    enabled: true
    companyName: Foo-Bar

# -----------------------------------------------------------------------------
# dev profile
# -----------------------------------------------------------------------------
litellmDev:
  enabled: false
  replicaCount: 1
  host: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  requestTimeout: 60
  bgeM3ApiBase: ""
  # The dev gateway is a single replica, so neither an autoscaler nor a
  # disruption budget adds anything; both stay off so the keys exist.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpread: false
  storeModelInDB: true
  useV2MigrationResolver: false
  d3DecisionApiBase: ""

# demo profile: one-shot seed jobs against the prod or dev database.
demo:
  enabled: false

# -----------------------------------------------------------------------------
# Guardrails and tools
# -----------------------------------------------------------------------------
presidio:
  analyzer:
    replicaCount: 1
    nlpEngine: spacy
    supportedLanguages: en
    workers: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
  anonymizer:
    replicaCount: 1
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi

searxng:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 1Gi

xberg:
  enabled: false
  replicaCount: 1
  logLevel: info
  maxRequestBodyBytes: 10485760
  maxMultipartFieldBytes: 10485760
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  # Deny-by-default egress. In Compose this is a local BIND resolver plus a
  # Squid proxy on a fixed subnet. In Kubernetes the NetworkPolicy plus the
  # allowlisting proxy carry the guarantee; the resolver is optional because a
  # pod cannot be given a ClusterIP that does not exist yet.
  egress:
    proxy:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1
          memory: 1Gi
    dns:
      enabled: false
      # Set to the xberg-dns Service ClusterIP after the first install, then
      # set xberg.dnsPolicy to None via xberg.extraPodSpec if you want hard
      # resolver pinning. NetworkPolicy is the primary control.
      clusterIP: ""
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

# -----------------------------------------------------------------------------
# Data stores
# -----------------------------------------------------------------------------
postgres:
  # Production LiteLLM database. One instance serves the litellm_prod and
  # litellm_dev databases, matching upstream.
  persistence:
    size: 20Gi
    storageClass: ""
    # Set to reuse a pre-created PVC instead of a volumeClaimTemplate.
    existingClaim: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  # ROI scenario inputs seeded by postgres-init.
  roi:
    minutesSavedPerRequest: 15
    minutesSavedPerSession: 0
    loadedHourlyCost: 75
    valueRealizationFactor: 0.25
    currency: USD

pgvector:
  # Shared vector store for the dev profile and auto-indexing.
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  connector:
    replicaCount: 1
    embeddingModel: openai/bge-m3
    embeddingDimensions: 1024
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi

qdrant:
  # Dev-profile semantic cache. Upstream keeps it in tmpfs; here it stays
  # in-memory by default, which is why persistence is off unless enabled.
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 2Gi

# -----------------------------------------------------------------------------
# Observability: metrics
# -----------------------------------------------------------------------------
prometheus:
  enabled: true
  persistence:
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  retentionTime: 15d
  retentionSize: 10GB
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  exporters:
    postgres: true
    pgvector: true
    blackbox: true
  # node-exporter and cAdvisor in Compose read the host directly. In Kubernetes
  # the kubelet already exposes cAdvisor metrics, so only node-exporter is
  # optional here and cAdvisor is never deployed.
  nodeExporter:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  # Scrape the cluster's kubelet and kube-state-metrics endpoints if present.
  kubernetesTargets:
    enabled: false

# -----------------------------------------------------------------------------
# Log and trace pipeline: Alloy -> Data Prepper -> OpenSearch
# -----------------------------------------------------------------------------
alloy:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 2Gi

opensearch:
  enabled: true
  # Single node, matching upstream. The chart never disables TLS or the
  # security plugin.
  replicas: 1
  javaHeap: 1g
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 3Gi
  persistence:
    size: 30Gi
    storageClass: ""
  # Consumed by the vm.max_map_count prerequisite documented in the README.
  ulimits:
    nofile: 65536
  retention:
    logs: 7
    metrics: 15
    usage: 180
    audit: 90
    traces: 15
  bridgeIntervalSeconds: 60
  usageOverlapMinutes: 30
  certificate:
    validityDays: 397
    renewBeforeDays: 30
  alertChannelId: ""

opensearchDashboards:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

dataPrepper:
  enabled: true
  javaOpts: "-Xms256m -Xmx512m"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

# -----------------------------------------------------------------------------
# grafana profile (optional): Grafana, Loki, and the Loki log collector
# -----------------------------------------------------------------------------
grafana:
  enabled: false
  host: ""
  allowSignUp: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  persistence:
    size: 5Gi
    storageClass: ""
  database:
    user: grafana_ro
  loki:
    enabled: true
    persistence:
      size: 10Gi
      storageClass: ""
    retention: 168h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

# -----------------------------------------------------------------------------
# langfuse profile (optional)
# The preflight Job refuses to start the profile until every required value is
# set, as upstream does.
# -----------------------------------------------------------------------------
langfuse:
  enabled: false
  webHost: ""
  s3Host: ""
  telemetryEnabled: false
  enableExperimentalFeatures: false
  s3BatchExportEnabled: false
  redisTlsEnabled: false
  trustedProxyCount: 1
  disableSignupOnboarding: true
  init:
    orgId: litellm-stack
    orgName: LiteLLM Stack
    projectId: litellm
    projectName: LiteLLM
  postgres:
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 4Gi
  clickhouse:
    persistence:
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 4Gi
  minio:
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
  redis:
    persistence:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1
        memory: 1Gi
  web:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
  worker:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

# -----------------------------------------------------------------------------
# lens profile (optional): agent-trace analysis with its own ClickHouse
# -----------------------------------------------------------------------------
lens:
  enabled: false
  host: ""
  traceRetentionDays: 14
  gatewayApiBase: ""
  # Lens keeps its ClickHouse alone on an internal-only network.
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  tmpSize: 1Gi
  pidsLimit: 128
  clickhouse:
    persistence:
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 4Gi

# -----------------------------------------------------------------------------
# security profile (optional): scheduled image vulnerability scanning
#
# The upstream monitor inspects the Docker socket. Kubernetes has no such
# socket, so this profile renders a CronJob that runs the same pinned Trivy
# release against the images this release actually runs, and optionally fails
# the Job on fixable Critical or KEV findings.
# -----------------------------------------------------------------------------
security:
  enabled: false
  schedule: "45 2 * * *"
  runOnInstall: true
  enforce: false
  severity: CRITICAL
  # Reports land in a PVC; mount it into your own collector if you need history.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 2500Mi
  backoffLimit: 2

# -----------------------------------------------------------------------------
# Network policies
#
# Reproduces the Compose network segmentation: internal-only services are
# reachable only from the pods that need them, and the Xberg sandbox may only
# reach its allowlisting proxy.
# -----------------------------------------------------------------------------
networkPolicies:
  enabled: true

# -----------------------------------------------------------------------------
# Maintenance Jobs
