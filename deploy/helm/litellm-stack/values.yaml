# Default values for the litellm-stack chart.
#
# This chart is the Kubernetes port of the upstream Docker Compose stack
# (https://github.com/bella-1337/effective-spoon). Every service in
# docker-compose.yml and compose.optional.yml has a Kubernetes workload here;
# the Compose profiles prod, dev, demo, grafana, langfuse, lens, and security
# map to the *.enabled flags below.
#
# Two rules this chart keeps from upstream:
#   1. Optional components stay off unless explicitly enabled, and nothing in
#      the core depends on them (gateways start without Langfuse and Lens).
#   2. No credential is ever committed. Provide an existing Secret or set
#      secrets.values.* so the chart renders one, and review it before install.

global:
  # Prefix for every image reference, including the in-house images this chart
  # expects. Set this to the additional registry, for example
  # "registry.inhouse.example". An empty value uses each image's own registry.
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

  # Storage class for every PVC. Empty uses the cluster default.
  storageClass: ""

  # Public DNS zone; hosts below default to <service>.<domain>.
  domain: example.test

  timezone: Europe/Berlin

  # Appended to every workload for node selection, tolerations, and affinity
  # defaults. Component-level values win.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Images
#
# The four "own" images are built from this repository and must be published to
# the additional in-house registry; see deploy/images/README.md. Upstream pins
# digests; `useDigest` keeps that behavior. Set `useDigest: false` to fall back
# to the mutable tag, which the upstream security notes advise against.
# -----------------------------------------------------------------------------
useDigest: true

