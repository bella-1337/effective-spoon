apiVersion: 1

datasources:
  - name: LiteLLM PG (dev)
    uid: litellm-pg-dev
    type: postgres
    access: proxy
    url: postgres:5432
    database: litellm_dev
    user: ${GRAFANA_DATABASE_USER}
    secureJsonData:
      password: ${GRAFANA_DATABASE_PASSWORD}
    jsonData:
      database: litellm_dev
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
    editable: false
