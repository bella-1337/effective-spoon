# Documentation site for the LiteLLM stack Helm chart, built with Zensical.
#
# The pages are the repository's own Markdown files, published from where they
# live: docs_dir is the repository root and exclude_docs keeps everything
# except Markdown and the site assets out of the site. Build and preview with
# scripts/build-docs.py, which installs the hash-locked toolchain from
# docs-site/requirements.txt. Guide: deploy/docs/documentation-site.md

site_name: LiteLLM stack on Kubernetes
site_description: >-
  Helm chart and documentation for running the LiteLLM gateway stack on
  Kubernetes: installation, secrets and ingress, upgrades, validation, and
  architecture.
site_url: !ENV [DOCS_SITE_URL, ""]
repo_url: https://github.com/bella-1337/symmetrical-engine
repo_name: bella-1337/symmetrical-engine
edit_uri: edit/main/
# The licence sentence below it is in docs-site/overrides/partials/copyright.html.
copyright: >-
  This chart and its documentation are published as is, without warranty of
  any kind, express or implied. Use them at your own risk.

docs_dir: .
site_dir: site

# Gitignore syntax, read top to bottom: exclude everything, re-include
# directories and Markdown pages and the site assets, then exclude hidden
# directories (including .git and the toolchain cache) and build output again.
# Zensical needs the trailing /** to exclude a directory's contents after the
# !*/ re-include.
exclude_docs: |
  *
  !*/
  !*.md
  !/docs-site/assets/**
  **/.*/**
  /.docs-cache/**
  /site/**
  /public/**
  **/node_modules/**

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  # No Google Fonts: the site makes no third-party requests.
  font: false
  logo: docs-site/assets/logo.svg
  favicon: docs-site/assets/favicon.svg
  icon:
    repo: material/source-repository
    edit: material/file-edit-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

extra:
  generator: false
  # Filled from the environment by scripts/build-docs.py and scripts/ci/docs.sh.
  # The defaults describe a local preview; any other kind hides its banner.
  build:
    version: !ENV [DOCS_VERSION, local]
    kind: !ENV [DOCS_VERSION_KIND, local]
    source_ref: !ENV [DOCS_SOURCE_REF, ""]
    commit: !ENV [DOCS_GIT_COMMIT, ""]
    date: !ENV [DOCS_BUILD_DATE, ""]

extra_css:
  - docs-site/assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Get started:
      - Chart overview: deploy/README.md
      - Getting started: deploy/docs/getting-started.md
      - In-house container images: deploy/images/README.md
      - Secrets, TLS, and ingress: deploy/docs/secrets-and-ingress.md
  - Operate:
      - Upgrades, rollback, and removal: deploy/docs/upgrades-and-rollback.md
      - Validation: deploy/docs/validation.md
  - Reference:
      - Architecture: deploy/docs/architecture.md
      - Values reference: deploy/docs/values-reference.md
      - Changelog: deploy/CHANGELOG.md
  - Development:
      - Documentation site: deploy/docs/documentation-site.md
