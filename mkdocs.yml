# Documentation site for the LiteLLM stack.
#
# The pages are the repository's own Markdown files; docs-site/hooks.py adds
# them under their repository paths. Build and preview with
# scripts/build-docs.py, which installs the hash-locked toolchain from
# docs-site/requirements.txt. Guide: docs/documentation-site.md

site_name: LiteLLM stack
site_description: >-
  Operator and developer documentation for the self-hosted LiteLLM gateway
  stack: architecture, deployment, operations, security, and compliance.
site_url: !ENV [DOCS_SITE_URL, ""]
repo_url: !ENV [DOCS_REPO_URL, "https://github.com/bella-1337/effective-spoon"]
repo_name: !ENV [DOCS_REPO_NAME, "litellm-stack"]
# hooks.py sets each page's edit link from its repository path.
edit_uri: ""
copyright: Internal documentation — do not share outside the organisation.

docs_dir: docs-site/content
site_dir: site
hooks:
  - docs-site/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  # No Google Fonts: the site makes no third-party requests.
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: material/source-repository
    edit: material/file-edit-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

extra:
  # Version selector: scripts/build-docs.py writes versions.json next to the
  # version directories. Pages of any version other than the latest release
  # and dev show the "outdated" banner (patterns are regular expressions).
  version:
    provider: mike
    default:
      - ^latest$
      - ^dev$
  generator: false
  # Filled by scripts/build-docs.py; the defaults describe a local preview.
  build:
    version: !ENV [DOCS_VERSION, local]
    kind: !ENV [DOCS_VERSION_KIND, local]
    source_ref: !ENV [DOCS_SOURCE_REF, master]
    revision: !ENV [DOCS_GIT_REVISION, HEAD]
    commit: !ENV [DOCS_GIT_COMMIT, ""]
    git_dir: !ENV [DOCS_GIT_DIR, ""]
    repo_kind: !ENV [DOCS_REPO_KIND, github]
    default_branch: !ENV [DOCS_DEFAULT_BRANCH, master]
    date: !ENV [DOCS_BUILD_DATE, ""]
    latest: !ENV [DOCS_LATEST_VERSION, ""]

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Get started:
      - Overview: README.md
      - First deployment: docs/getting-started.md
      - Hardware sizing: docs/hardware-sizing.md
      - Remote GPU host: gpu-host/README.md
      - Environment variables: docs/environment-variables.md
  - Architecture:
      - Stack architecture: ARCHITECTURE.md
      - Diagrams: diagrams/README.md
      - Diagram gallery: diagrams/gallery.md
      - Databases and pgvector: docs/databases-and-pgvector.md
      - Search, extraction, and caching: docs/search-extraction-and-caching.md
      - Presidio guardrails: docs/presidio-guardrails.md
  - Operations:
      - Observability: docs/observability.md
      - Maintenance runtime: docs/maintenance-runtime.md
      - Backup and restore: docs/backup-and-restore.md
      - Upgrades and rollback: docs/upgrades-and-rollback.md
      - Operations game day: OPERATIONS-GAME-DAY.md
      - Branding and virtual keys: docs/branding-and-key-management.md
      - Branding assets: branding/README.md
  - Security and compliance:
      - Edge and abuse protection: docs/edge-and-abuse-protection.md
      - EU technical controls: docs/eu-technical-controls.md
      - Image security: docs/image-security.md
      - Third-party licences: docs/third-party-licences.md
      - Dev-to-prod promotion register: docs/dev-to-prod-promotion-register.md
  - Development:
      - Development workflow: docs/development-workflow.md
      - Documentation site: docs/documentation-site.md
      - Stack maintenance skill: SKILL.md
      - Agent instructions: AGENTS.md
      - Dev-to-prod delta prompt: docs/prompts/create-dev-to-prod-delta.md
  - Reports:
      - Security probe 2026-11-01: docs/security-probe-2026-11-01.md
      - Stack review 2026-10-26: STACK-REVIEW-2026-10-26-COMMIT-7f611c8.md
      - Changelog: changelog.md
