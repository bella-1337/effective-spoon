# Documentation site for the LiteLLM stack, built with Zensical.
#
# The pages are the repository's own Markdown files, published from where
# they live: docs_dir is the repository root and exclude_docs keeps everything
# except Markdown, the rendered diagrams, and the site assets out of the site.
# Build and preview with scripts/build-docs.py, which installs the hash-locked
# toolchain from docs-site/requirements.txt. Guide: docs/documentation-site.md

site_name: LiteLLM stack
site_description: >-
  Operator and developer documentation for the self-hosted LiteLLM gateway
  stack: architecture, deployment, operations, security, and compliance.
site_url: !ENV [DOCS_SITE_URL, ""]
repo_url: !ENV [DOCS_REPO_URL, "https://github.com/bella-1337/effective-spoon"]
repo_name: !ENV [DOCS_REPO_NAME, "litellm-stack"]
# Edit links open the file on the default branch; scripts/build-docs.py
# points release versions at the file in the release tag instead.
edit_uri: !ENV [DOCS_EDIT_URI, "edit/master/"]
copyright: Internal documentation — do not share outside the organisation.

docs_dir: .
site_dir: site

# Gitignore syntax, read top to bottom: exclude everything, re-include the
# published files, then exclude hidden directories (including the toolchain
# cache), build output, and runtime state again. Zensical needs the trailing
# /** to exclude a directory's contents after !*/ re-included directories.
exclude_docs: |
  *
  !*/
  !*.md
  !/diagrams/*.html
  !/diagrams/*.mmd
  !/docs/**/*.png
  !/docs/**/*.svg
  !/docs-site/assets/**
  **/.*/**
  /site/**
  /public/**
  /dist/**
  /logs/**
  /backups/**
  /upgrade-state/**
  /security-metrics/**
  /security-reports/**
  /security-state/**
  **/node_modules/**

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  # No Google Fonts: the site makes no third-party requests.
  font: false
  logo: docs-site/assets/logo.svg
  favicon: docs-site/assets/favicon.svg
  icon:
    repo: material/source-repository
    edit: material/file-edit-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

extra:
  # Version selector: scripts/build-docs.py writes versions.json next to the
  # version directories. Pages of any version other than the latest release
  # and dev show the "outdated" banner (patterns are regular expressions).
  version:
    provider: mike
    default:
      - ^latest$
      - ^dev$
  generator: false
  # Filled by scripts/build-docs.py; the defaults describe a local preview.
  build:
    version: !ENV [DOCS_VERSION, local]
    kind: !ENV [DOCS_VERSION_KIND, local]
    source_ref: !ENV [DOCS_SOURCE_REF, master]
    commit: !ENV [DOCS_GIT_COMMIT, ""]
    default_branch: !ENV [DOCS_DEFAULT_BRANCH, master]
    date: !ENV [DOCS_BUILD_DATE, ""]
    latest: !ENV [DOCS_LATEST_VERSION, ""]

extra_css:
  - docs-site/assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
