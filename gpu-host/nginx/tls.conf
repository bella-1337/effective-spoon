worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout combined;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Resolve upstreams per request through Docker's DNS so one model can start,
  # restart, or fail without blocking the other's endpoint.
  resolver 127.0.0.11 valid=10s ipv6=off;

  ssl_certificate /run/secrets/tls.crt;
  ssl_certificate_key /run/secrets/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # TLS 1.2 is limited to forward-secret AEAD suites, as on the main stack's edge.
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;

  # D3-mini: only the three Decisions routes.
  server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    set $d3 http://d3-mini:8899;

    location = /v1/systemone {
      proxy_pass $d3;
      proxy_read_timeout 30s;
    }

    location = /v1/decisions {
      proxy_pass $d3;
      proxy_read_timeout 30s;
    }

    location = /v1/systemone/models {
      proxy_pass $d3;
      proxy_read_timeout 30s;
    }

    location / {
      return 404;
    }
  }

  # BGE-M3 on Text Embeddings Inference: embeddings and health only. TEI's own
  # metrics, docs, tokenizer, and SageMaker routes are not published.
  server {
    listen 9443 ssl;
    server_name _;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    set $bge_m3 http://bge-m3:8080;

    location = /v1/embeddings {
      proxy_pass $bge_m3;
      proxy_read_timeout 90s;
    }

    location = /health {
      proxy_pass $bge_m3;
      proxy_read_timeout 15s;
    }

    location / {
      return 404;
    }
  }
}
