name: ${COMPOSE_PROJECT_NAME:-litellm-stack}

x-langfuse-environment: &langfuse-environment
  HOSTNAME: 0.0.0.0
  TZ: ${STACK_TIMEZONE:-Europe/Berlin}
  NEXTAUTH_URL: https://${LANGFUSE_WEB_HOST:-langfuse.example.test}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "${LANGFUSE_TELEMETRY_ENABLED:-false}"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
  REDIS_TLS_ENABLED: "${LANGFUSE_REDIS_TLS_ENABLED:-false}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

networks:
  edge: {}
  internal: {}
  security-monitor: {}
  traefik-monitor:
    internal: true
  alloy-monitor:
    internal: true
  xberg-sandbox:
    internal: true
  egress: {}

volumes:
  pg-data: {}
  pgvector-data: {}
  grafana-data: {}
  prometheus-data: {}
  prometheus-secrets: {}
  loki-data: {}
  langfuse-postgres-data: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-minio-data: {}
  langfuse-redis-data: {}
  bge-m3-vllm-cache: {}

services:
  traefik:
    logging: *default-logging
    image: traefik:v3@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-litellm-stack}_edge
      - --providers.docker.endpoint=tcp://traefik-docker-proxy:2375
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --accesslog=true
      - --accesslog.fields.names.ClientHost=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - type: bind
        source: ${TRAEFIK_TLS_CERT_FILE:-./traefik/certs/litellm-stack.pem}
        target: /certs/tls.crt
        read_only: true
      - type: bind
        source: ${TRAEFIK_TLS_KEY_FILE:-./traefik/certs/litellm-stack-key.pem}
        target: /certs/tls.key
        read_only: true
    depends_on:
      traefik-docker-proxy:
        condition: service_healthy
    networks: [edge, internal, traefik-monitor]
    restart: unless-stopped

  traefik-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [traefik-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: litellm_prod
      POSTGRES_USER: ${PG_USER:-litellm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    logging: *default-logging
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?Set GRAFANA_DATABASE_PASSWORD in .env}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
        \getenv grafana_password GRAFANA_DATABASE_PASSWORD
        \getenv exporter_password PG_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE grafana_ro LOGIN PASSWORD %L', :'grafana_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_ro') \gexec
        SELECT format('ALTER ROLE grafana_ro PASSWORD %L', :'grafana_password') \gexec
        SELECT format('CREATE ROLE litellm_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'litellm_exporter') \gexec
        SELECT format('ALTER ROLE litellm_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO litellm_exporter;
        GRANT CONNECT ON DATABASE postgres TO litellm_exporter;
        SQL
        for db in litellm_prod litellm_dev; do
          exists="$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname='$${db}'")"
          if [ "$${exists}" != "1" ]; then
            psql --dbname postgres --command "CREATE DATABASE \"$${db}\""
          fi
          psql --dbname "$${db}" --set ON_ERROR_STOP=1 --set database_name="$${db}" <<'SQL'
        GRANT CONNECT ON DATABASE :"database_name" TO grafana_ro;
        GRANT USAGE ON SCHEMA public TO grafana_ro;
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_ro;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafana_ro;
        SQL
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  vector-postgres:
    logging: *default-logging
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: vector_store
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    logging: *default-logging
    profiles: [dev]
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage:rw,noexec,nosuid,size=${QDRANT_STORAGE_SIZE:-1g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-1}"
          memory: ${QDRANT_MEMORY_LIMIT:-2g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  bge-m3-vllm:
    logging: *default-logging
    profiles: [dev]
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    command:
      - --model
      - ${BGE_M3_MODEL:-BAAI/bge-m3}
      - --served-model-name
      - ${BGE_M3_SERVED_MODEL_NAME:-bge-m3}
      - --runner
      - pooling
      - --dtype
      - ${BGE_M3_DTYPE:-half}
      - --max-model-len
      - "${BGE_M3_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - ${BGE_M3_VLLM_GPU_MEMORY_UTILIZATION:-0.35}
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /tmp/vllm
    volumes:
      - bge-m3-vllm-cache:/root/.cache/huggingface
    shm_size: ${BGE_M3_SHM_SIZE:-2gb}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-6g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: ${BGE_M3_HEALTH_START_PERIOD:-15m}

  vllm-semantic-router:
    logging: *default-logging
    profiles: [dev]
    image: ghcr.io/vllm-project/semantic-router/vllm-sr:latest@sha256:f613ce23a4f8e19357090ef83e614468dd7baa939b4634ad33144584e1c2cb09
    user: "65532:65532"
    command: ["/app/config.yaml"]
    volumes:
      - ./vllm-semantic-router/config.yaml:/app/config.yaml:ro
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/.vllm-sr:uid=65532,gid=65532,mode=0750
      - /app/models:uid=65532,gid=65532,mode=0750
    deploy:
      resources:
        limits:
          cpus: "${VLLM_SR_CPU_LIMIT:-2}"
          memory: ${VLLM_SR_MEMORY_LIMIT:-7g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: ${VLLM_SR_HEALTH_START_PERIOD:-5m}

  vllm-semantic-router-envoy:
    logging: *default-logging
    profiles: [dev]
    image: envoyproxy/envoy:v1.36.2@sha256:4972515dd9a069b44beb43cebba7851596e72a8c61cd7a7c33d8f48efc5280ba
    user: "101:101"
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "${VLLM_SR_ENVOY_LOG_LEVEL:-warning}"]
    volumes:
      - ./vllm-semantic-router/envoy.yaml:/etc/envoy/envoy.yaml:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "${VLLM_SR_ENVOY_CPU_LIMIT:-1}"
          memory: ${VLLM_SR_ENVOY_MEMORY_LIMIT:-512m}
    depends_on:
      vllm-semantic-router:
        condition: service_healthy
      litellm-dev:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/19000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.vllm-semantic-router.rule=Host(`${VLLM_SR_HOST:-llm-router.example.test}`)
      - traefik.http.routers.vllm-semantic-router.entrypoints=websecure
      - traefik.http.routers.vllm-semantic-router.tls=true
      - traefik.http.services.vllm-semantic-router.loadbalancer.server.port=8899

  pgvector-migrate:
    logging: *default-logging
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /migrations/20-litellm-pgvector.sql
    volumes:
      - ./pgvector/migrate.sql:/migrations/20-litellm-pgvector.sql:ro
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  pgvector-access-init:
    logging: *default-logging
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
      PG_VECTOR_EXPORTER_PASSWORD: ${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        psql --set ON_ERROR_STOP=1 <<'SQL'
        \getenv exporter_password PG_VECTOR_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE vector_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vector_exporter') \gexec
        SELECT format('ALTER ROLE vector_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO vector_exporter;
        GRANT CONNECT ON DATABASE vector_store TO vector_exporter;
        SQL
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  presidio-analyzer:
    logging: *default-logging
    image: mcr.microsoft.com/presidio-analyzer:latest@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    environment:
      PRESIDIO_NLP_ENGINE: ${PRESIDIO_NLP_ENGINE:-spacy}
      PRESIDIO_SUPPORTED_LANGUAGES: ${PRESIDIO_SUPPORTED_LANGUAGES:-en}
      NLP_CONF_FILE: /app/presidio_analyzer/conf/litellm-analyzer.yaml
    volumes:
      - ./presidio/analyzer.yaml:/app/presidio_analyzer/conf/litellm-analyzer.yaml:ro
    deploy:
      resources:
        limits:
          memory: ${PRESIDIO_ANALYZER_MEMORY_LIMIT:-2g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  presidio-anonymizer:
    logging: *default-logging
    image: mcr.microsoft.com/presidio-anonymizer:latest@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    logging: *default-logging
    image: searxng/searxng:latest@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOST:-search.example.test}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST:-search.example.test}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080

  xberg:
    logging: *default-logging
    profiles: [prod, dev]
    image: ghcr.io/xberg-io/xberg:core@sha256:f0a66d39f7322c273bb4ba2b53f5ca00dee9f2f1b3ebbec26a283017e07a865b
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allowed-host
      - xberg
      - --allowed-host
      - xberg:8001
    environment:
      RUST_LOG: ${XBERG_LOG_LEVEL:-info}
      XBERG_CACHE_DIR: /tmp/xberg-cache
      HF_HOME: /tmp/huggingface
      XBERG_MAX_REQUEST_BODY_BYTES: "${XBERG_MAX_REQUEST_BODY_BYTES:-10485760}"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "${XBERG_MAX_MULTIPART_FIELD_BYTES:-10485760}"
      HTTP_PROXY: http://xberg-egress-proxy:3128
      HTTPS_PROXY: http://xberg-egress-proxy:3128
      ALL_PROXY: http://xberg-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "${XBERG_CPU_LIMIT:-1}"
          memory: ${XBERG_MEMORY_LIMIT:-1g}
    depends_on:
      xberg-egress-proxy:
        condition: service_healthy
    networks: [xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - --request
        - POST
        - --header
        - "Content-Type: application/json"
        - --header
        - "Accept: application/json, text/event-stream"
        - --data
        - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1"}}}'
        - http://127.0.0.1:8001/mcp
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xberg-egress-proxy:
    logging: *default-logging
    image: ubuntu/squid:6.13-25.04_edge@sha256:3de2e64f0ca6efdac3e98557607dc0f23050037f3885016d5d5bfcf9950501b8
    command: ["-f", "/etc/squid/xberg-egress-squid.conf", "-NYC"]
    volumes:
      - ./security/xberg-egress-squid.conf:/etc/squid/xberg-egress-squid.conf:ro
      - ./security/xberg-egress-allowlist.txt:/etc/squid/xberg-egress-allowlist.txt:ro
    networks: [xberg-sandbox, egress]
    read_only: true
    tmpfs:
      - /run:mode=0755
      - /var/log/squid:uid=13,gid=13,mode=0750
      - /var/spool/squid:uid=13,gid=13,mode=0750
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-ec", ": >/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
    volumes:
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    depends_on:
      prometheus-secrets-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  prometheus-secrets-init:
    logging: *default-logging
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 0400 -o 65534 -g 65534 \
          /source/litellm-master-key \
          /target/litellm-master-key
    volumes:
      - ./litellm/secrets/litellm-master-key:/source/litellm-master-key:ro
      - prometheus-secrets:/target
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks: [internal]
    restart: "no"

  loki:
    logging: *default-logging
    image: grafana/loki:3.5.12@sha256:c2a6860c2f94ecc98fffce7c10e6c8b350cf25e2ea3daa255dff27d7c6a4dffc
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    user: "473:473"
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_healthy
      alloy-docker-proxy:
        condition: service_healthy
    networks: [internal, alloy-monitor]
    restart: unless-stopped

  alloy-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [alloy-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  langfuse-postgres:
    logging: *default-logging
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}
      TZ: ${STACK_TIMEZONE:-Europe/Berlin}
      PGTZ: ${STACK_TIMEZONE:-Europe/Berlin}
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-minio:
    logging: *default-logging
    image: cgr.dev/chainguard/minio:latest@sha256:c47b1779bfd12cdf5a4fcd3bd50671b8d66465fdae45271babc2fb467958b712
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
    volumes:
      - langfuse-minio-data:/data
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse-s3.rule=Host(`${LANGFUSE_S3_HOST:-langfuse-s3.example.test}`)
      - traefik.http.routers.langfuse-s3.entrypoints=websecure
      - traefik.http.routers.langfuse-s3.tls=true
      - traefik.http.services.langfuse-s3.loadbalancer.server.port=9000

  langfuse-redis:
    logging: *default-logging
    image: redis:7.4.11@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
    volumes:
      - langfuse-redis-data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-worker:
    logging: *default-logging
    image: docker.langfuse.com/langfuse/langfuse-worker:4@sha256:48f8af2c4b6bbf929380f301ade18cf99e7b31331fd26dfaf253ce670e5b39a2
    environment:
      <<: *langfuse-environment
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    logging: *default-logging
    image: docker.langfuse.com/langfuse/langfuse:4@sha256:e4cc4bfd0f77285d7454135e1bd14020abdd5c4217a2f0e824b8abcbf3e3cc0f
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: https://${LANGFUSE_S3_HOST:-langfuse-s3.example.test}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-litellm-stack}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-LiteLLM Stack}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-litellm}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-LiteLLM}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?Set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?Set LANGFUSE_INIT_USER_NAME in .env}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Set LANGFUSE_INIT_USER_PASSWORD in .env}
      LANGFUSE_TRUSTED_PROXY_COUNT: "${LANGFUSE_TRUSTED_PROXY_COUNT:-1}"
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "${LANGFUSE_DISABLE_SIGNUP_ONBOARDING:-true}"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse.rule=Host(`${LANGFUSE_WEB_HOST:-langfuse.example.test}`)
      - traefik.http.routers.langfuse.entrypoints=websecure
      - traefik.http.routers.langfuse.tls=true
      - traefik.http.services.langfuse.loadbalancer.server.port=3000

  grafana:
    logging: *default-logging
    image: grafana/grafana:latest@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECURITY_SECRET_KEY:?Set GRAFANA_SECURITY_SECRET_KEY in .env}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-grafana.example.test}
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP:-false}"
      GRAFANA_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana_ro}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?Set GRAFANA_DATABASE_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.example.test}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  litellm-prod:
    logging: *default-logging
    profiles: [prod]
    image: ghcr.io/berriai/litellm:v1.106.3@sha256:74d0696a9f0afcc993c7659d246f0c542f003368298633e852228250779f1032
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.prod.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER:-litellm}:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/litellm_prod
      STORE_MODEL_IN_DB: "${LITELLM_STORE_MODEL_IN_DB:-True}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      LITELLM_OTEL_V2: "${LITELLM_OTEL_V2:-true}"
      LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS: ""
      LITELLM_OTEL_BAGGAGE_METADATA_KEYS: ""
      LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS: ""
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:?Set LANGFUSE_USER_ID_SALT in .env}
      LANGFUSE_HOST: http://langfuse-web:3000
      PROXY_BASE_URL: https://${LITELLM_PROD_HOST:-llm.example.test}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    networks: [edge, internal, xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-prod.rule=Host(`${LITELLM_PROD_HOST:-llm.example.test}`)
      - traefik.http.routers.litellm-prod.entrypoints=websecure
      - traefik.http.routers.litellm-prod.tls=true
      - traefik.http.services.litellm-prod.loadbalancer.server.port=4000

  litellm-demo-data-prod:
    logging: *default-logging
    profiles: [demo]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGDATABASE: litellm_prod
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /seed/demo-data.sql
    volumes:
      - ./litellm/demo-data.sql:/seed/demo-data.sql:ro
    depends_on:
      litellm-prod:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  litellm-dev:
    logging: *default-logging
    profiles: [dev]
    image: ghcr.io/berriai/litellm:v1.107.0-dev.3@sha256:e7f68da02ed3ec52f0b8d386dbb278a0aa06dbc879f5ddda5a3cf87b2bff194c
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.dev.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER:-litellm}:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/litellm_dev
      STORE_MODEL_IN_DB: "${LITELLM_STORE_MODEL_IN_DB:-True}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      LITELLM_OTEL_V2: "${LITELLM_OTEL_V2:-true}"
      LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS: ""
      LITELLM_OTEL_BAGGAGE_METADATA_KEYS: ""
      LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS: ""
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:?Set LANGFUSE_USER_ID_SALT in .env}
      LANGFUSE_HOST: http://langfuse-web:3000
      PG_VECTOR_API_BASE: http://litellm-pgvector:8000
      PG_VECTOR_API_KEY: ${PG_VECTOR_API_KEY:?Set PG_VECTOR_API_KEY in .env}
      VECTOR_DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}@vector-postgres:5432/vector_store
      QDRANT_API_BASE: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      XBERG_INDEX_EMBEDDING_MODEL: ${XBERG_INDEX_EMBEDDING_MODEL:-hosted_vllm/bge-m3}
      XBERG_INDEX_EMBEDDING_API_BASE: http://bge-m3-vllm:8000
      XBERG_AUTO_INDEX_ENABLED: ${XBERG_AUTO_INDEX_ENABLED:-false}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      PROXY_BASE_URL: https://${LITELLM_DEV_HOST:-llm-dev.example.test}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
      xberg:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      bge-m3-vllm:
        condition: service_healthy
    networks: [edge, internal, xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-dev.rule=Host(`${LITELLM_DEV_HOST:-llm-dev.example.test}`)
      - traefik.http.routers.litellm-dev.entrypoints=websecure
      - traefik.http.routers.litellm-dev.tls=true
      - traefik.http.services.litellm-dev.loadbalancer.server.port=4000

  litellm-demo-data-dev:
    logging: *default-logging
    profiles: [dev]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGDATABASE: litellm_dev
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /seed/demo-data.sql
    volumes:
      - ./litellm/demo-data.sql:/seed/demo-data.sql:ro
    depends_on:
      litellm-dev:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  litellm-pgvector:
    logging: *default-logging
    profiles: [dev]
    image: litellm-pgvector:5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    build:
      context: .
      dockerfile: pgvector/Dockerfile
      additional_contexts:
        upstream: https://github.com/BerriAI/litellm-pgvector.git#5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    environment:
      DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}@vector-postgres:5432/vector_store?schema=public
      SERVER_API_KEY: ${PG_VECTOR_API_KEY:?Set PG_VECTOR_API_KEY in .env}
      HOST: 0.0.0.0
      PORT: "8000"
      EMBEDDING__MODEL: ${PGVECTOR_EMBEDDING_MODEL:-openai/bge-m3}
      EMBEDDING__BASE_URL: http://litellm-dev:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      EMBEDDING__DIMENSIONS: "${PGVECTOR_EMBEDDING_DIMENSIONS:-1024}"
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
      litellm-dev:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:latest@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://litellm_exporter:${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  pgvector-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:latest@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://vector_exporter:${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}@vector-postgres:5432/vector_store?sslmode=disable
    depends_on:
      pgvector-access-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - ./security-metrics:/textfile:ro
    networks: [internal]
    restart: unless-stopped

  image-security-docker-proxy:
    logging: *default-logging
    profiles: [security]
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [security-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  image-security-monitor:
    logging: *default-logging
    profiles: [security]
    image: litellm-image-security-monitor:0.1.0
    build:
      context: .
      dockerfile: security/image-monitor.Dockerfile
    user: "${IMAGE_SECURITY_UID:-1000}:${IMAGE_SECURITY_GID:-1000}"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-litellm-stack}"
      TZ: "${STACK_TIMEZONE:-Europe/Berlin}"
      DOCKER_HOST: tcp://image-security-docker-proxy:2375
      IMAGE_SECURITY_STATE_DIR: /data/state
      IMAGE_SECURITY_REPORT_DIR: /data/reports
      IMAGE_SECURITY_METRICS_DIR: /data/metrics
      IMAGE_SECURITY_EXCEPTIONS_FILE: /app/security/exceptions.toml
      IMAGE_SECURITY_TRIVY_EXECUTABLE: /usr/local/bin/trivy
      IMAGE_SECURITY_SCHEDULE_HOUR: "${IMAGE_SECURITY_SCHEDULE_HOUR:-2}"
      IMAGE_SECURITY_SCHEDULE_MINUTE: "${IMAGE_SECURITY_SCHEDULE_MINUTE:-45}"
      IMAGE_SECURITY_RUN_ON_START: "${IMAGE_SECURITY_RUN_ON_START:-true}"
    command: ["--all"]
    volumes:
      - ./security-state:/data/state
      - ./security-reports:/data/reports
      - ./security-metrics:/data/metrics
      - ./security/exceptions.toml:/app/security/exceptions.toml:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      image-security-docker-proxy:
        condition: service_healthy
    networks: [security-monitor]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${IMAGE_SECURITY_CPU_LIMIT:-2}"
          memory: ${IMAGE_SECURITY_MEMORY_LIMIT:-2500m}
          pids: ${IMAGE_SECURITY_PIDS_LIMIT:-256}
    restart: ${IMAGE_SECURITY_RESTART_POLICY:-on-failure:5}

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:latest@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped

  blackbox:
    logging: *default-logging
    image: prom/blackbox-exporter:latest@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    networks: [internal]
    restart: unless-stopped
