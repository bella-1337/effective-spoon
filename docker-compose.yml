name: litellm-stack

networks:
  edge: {}
  internal: {}

volumes:
  pg-data: {}
  grafana-data: {}
  prometheus-data: {}
  loki-data: {}
  promtail-positions: {}

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=litellm-stack_edge
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
    networks: [edge, internal]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm_prod
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        for db in litellm_prod litellm_dev; do
          exists="$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname='$${db}'")"
          if [ "$${exists}" != "1" ]; then
            psql --dbname postgres --command "CREATE DATABASE \"$${db}\""
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    environment:
      PRESIDIO_NLP_ENGINE: spacy
      PRESIDIO_SUPPORTED_LANGUAGES: en
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal]
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    networks: [internal]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOST}/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./litellm/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    networks: [internal]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.12
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  promtail:
    image: grafana/promtail:3.5.12
    user: "0:0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/run/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
      GF_USERS_ALLOW_SIGN_UP: "false"
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  litellm-prod:
    profiles: [prod]
    image: ghcr.io/berriai/litellm-database:main-stable
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.prod.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/litellm_prod
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-prod.rule=Host(`${LITELLM_PROD_HOST}`)
      - traefik.http.routers.litellm-prod.entrypoints=websecure
      - traefik.http.routers.litellm-prod.tls=true
      - traefik.http.services.litellm-prod.loadbalancer.server.port=4000

  litellm-dev:
    profiles: [dev]
    image: ghcr.io/berriai/litellm-database:main-stable
    command:
      - --config=/app/config.yaml
      - --port=4000
      - --detailed_debug
    volumes:
      - ./litellm/config.dev.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/litellm_dev
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-dev.rule=Host(`${LITELLM_DEV_HOST}`)
      - traefik.http.routers.litellm-dev.entrypoints=websecure
      - traefik.http.routers.litellm-dev.tls=true
      - traefik.http.services.litellm-dev.loadbalancer.server.port=4000

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks: [internal]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:latest
    networks: [internal]
    restart: unless-stopped
