      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_CA_FILE: /certs/ca/ca.pem
      OPENSEARCH_USERNAME: litellm_bridge
      OPENSEARCH_PASSWORD: ${OPENSEARCH_BRIDGE_PASSWORD:?Set OPENSEARCH_BRIDGE_PASSWORD in .env}
      PROMETHEUS_URL: http://prometheus:9090
      LITELLM_DATABASE_HOST: postgres
      LITELLM_DATABASE_USER: opensearch_ro
      LITELLM_DATABASE_PASSWORD: ${OPENSEARCH_DATABASE_PASSWORD:?Set OPENSEARCH_DATABASE_PASSWORD in .env}
      OPENSEARCH_BRIDGE_INTERVAL_SECONDS: "${OPENSEARCH_BRIDGE_INTERVAL_SECONDS:-60}"
      OPENSEARCH_USAGE_RETENTION_DAYS: "${OPENSEARCH_USAGE_RETENTION_DAYS:-180}"
      OPENSEARCH_USAGE_OVERLAP_MINUTES: "${OPENSEARCH_USAGE_OVERLAP_MINUTES:-30}"
      OPENSEARCH_SESSION_ID_SALT: ${LANGFUSE_USER_ID_SALT:?Set LANGFUSE_USER_ID_SALT in .env}
    volumes:
      - opensearch-ca:/certs/ca:ro
      - ./grafana/alerting:/app/alerting:ro
      - ./opensearch/tools/metrics.yml:/app/metrics.yml:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "litellm_opensearch", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3m

  litellm-prod:
    logging: *default-logging
    profiles: [prod]
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.prod.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
      - ${D3_DECISION_CA_BUNDLE:?Set D3_DECISION_CA_BUNDLE in .env}:/etc/ssl/certs/d3-decision-ca-bundle.pem:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER:-litellm}:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/litellm_prod
      STORE_MODEL_IN_DB: "${LITELLM_STORE_MODEL_IN_DB:-True}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      D3_DECISION_API_BASE: ${D3_DECISION_API_BASE:?Set D3_DECISION_API_BASE in .env}
      D3_DECISION_API_KEY: ${D3_DECISION_API_KEY:?Set D3_DECISION_API_KEY in .env}
      SSL_CERT_FILE: /etc/ssl/certs/d3-decision-ca-bundle.pem
      LITELLM_OTEL_V2: "${LITELLM_OTEL_V2:-true}"
      # Request and service spans also go to OpenSearch Trace Analytics through
      # Data Prepper; Langfuse keeps its own exporter.
      OTEL_EXPORTER: ${LITELLM_OTEL_TRACE_EXPORTER:-otlp_grpc}
      OTEL_ENDPOINT: http://data-prepper:21890
      OTEL_SERVICE_NAME: litellm-prod
      OTEL_ENVIRONMENT_NAME: production
      LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS: ""
      LITELLM_OTEL_BAGGAGE_METADATA_KEYS: ""
      LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS: ""
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:?Set LANGFUSE_USER_ID_SALT in .env}
      LANGFUSE_HOST: http://langfuse-web:3000
      PROXY_BASE_URL: https://${LITELLM_PROD_HOST:-llm.example.test}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    networks: [edge, internal, xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-prod.rule=Host(`${LITELLM_PROD_HOST:-llm.example.test}`)
      - traefik.http.routers.litellm-prod.entrypoints=websecure
      - traefik.http.routers.litellm-prod.tls=true
      - traefik.http.services.litellm-prod.loadbalancer.server.port=4000

