      QDRANT_API_BASE: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      XBERG_INDEX_EMBEDDING_MODEL: ${XBERG_INDEX_EMBEDDING_MODEL:-hosted_vllm/bge-m3}
      XBERG_INDEX_EMBEDDING_API_BASE: http://bge-m3-vllm:8000
      XBERG_AUTO_INDEX_ENABLED: ${XBERG_AUTO_INDEX_ENABLED:-false}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      PROXY_BASE_URL: https://${LITELLM_DEV_HOST:?Set LITELLM_DEV_HOST in .env}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
      xberg:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
        required: false
      bge-m3-vllm:
        condition: service_healthy
    networks: [edge, internal, xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-dev.rule=Host(`${LITELLM_DEV_HOST:?Set LITELLM_DEV_HOST in .env}`)
      - traefik.http.routers.litellm-dev.entrypoints=websecure
      - traefik.http.routers.litellm-dev.tls=true
      - traefik.http.services.litellm-dev.loadbalancer.server.port=4000

  litellm-demo-data-dev:
    logging: *default-logging
    profiles: [dev]
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      PGHOST: postgres
      PGDATABASE: litellm_dev
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /seed/demo-data.sql
    volumes:
      - ./litellm/demo-data.sql:/seed/demo-data.sql:ro
    depends_on:
      litellm-dev:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  litellm-pgvector:
    logging: *default-logging
    profiles: [dev]
    image: litellm-pgvector:5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    build:
      context: .
      dockerfile: pgvector/Dockerfile
      additional_contexts:
        upstream: https://github.com/BerriAI/litellm-pgvector.git#5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-pgvector
        org.opencontainers.image.description: LiteLLM pgvector vector-store connector built from the pinned upstream commit
        org.opencontainers.image.version: 5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
        org.opencontainers.image.base.name: python:3.11.18-slim-bookworm
        org.opencontainers.image.source: https://github.com/BerriAI/litellm-pgvector
        org.opencontainers.image.url: https://github.com/BerriAI/litellm-pgvector
        org.opencontainers.image.revision: 5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
        org.opencontainers.image.licenses: MIT
    environment:
      DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}@vector-postgres:5432/vector_store?schema=public
      SERVER_API_KEY: ${PG_VECTOR_API_KEY:?Set PG_VECTOR_API_KEY in .env}
      HOST: 0.0.0.0
      PORT: "8000"
      EMBEDDING__MODEL: ${PGVECTOR_EMBEDDING_MODEL:-openai/bge-m3}
      EMBEDDING__BASE_URL: http://litellm-dev:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      EMBEDDING__DIMENSIONS: "${PGVECTOR_EMBEDDING_DIMENSIONS:-1024}"
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
      litellm-dev:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://litellm_exporter:${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  pgvector-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://vector_exporter:${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}@vector-postgres:5432/vector_store?sslmode=disable
    depends_on:
      pgvector-access-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - ./security-metrics:/textfile:ro
    networks: [internal]
    restart: unless-stopped

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped

  blackbox:
    logging: *default-logging
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    networks: [internal]
    restart: unless-stopped
