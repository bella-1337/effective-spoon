name: litellm-stack

networks:
  edge: {}
  internal: {}

volumes:
  pg-data: {}
  pgvector-data: {}
  grafana-data: {}
  prometheus-data: {}
  loki-data: {}

services:
  traefik:
    image: traefik:v3@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=litellm-stack_edge
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --accesslog=true
      - --accesslog.fields.names.ClientHost=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
    networks: [edge, internal]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: litellm_prod
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        for db in litellm_prod litellm_dev; do
          exists="$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname='$${db}'")"
          if [ "$${exists}" != "1" ]; then
            psql --dbname postgres --command "CREATE DATABASE \"$${db}\""
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  vector-postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: vector_store
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${PG_VECTOR_PASSWORD}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector-migrate:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /migrations/20-litellm-pgvector.sql
    volumes:
      - ./pgvector/migrate.sql:/migrations/20-litellm-pgvector.sql:ro
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    environment:
      PRESIDIO_NLP_ENGINE: spacy
      PRESIDIO_SUPPORTED_LANGUAGES: en
      NLP_CONF_FILE: /app/presidio_analyzer/conf/litellm-analyzer.yaml
    volumes:
      - ./presidio/analyzer.yaml:/app/presidio_analyzer/conf/litellm-analyzer.yaml:ro
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal]
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    networks: [internal]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOST}/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080

  xberg:
    profiles: [prod, dev]
    image: ghcr.io/xberg-io/xberg:core@sha256:f0a66d39f7322c273bb4ba2b53f5ca00dee9f2f1b3ebbec26a283017e07a865b
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allowed-host
      - xberg
      - --allowed-host
      - xberg:8001
    environment:
      RUST_LOG: info
      XBERG_CACHE_DIR: /tmp/xberg-cache
      HF_HOME: /tmp/huggingface
      XBERG_MAX_REQUEST_BODY_BYTES: "10485760"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "10485760"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "xberg", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./litellm/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    networks: [internal]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.12@sha256:c2a6860c2f94ecc98fffce7c10e6c8b350cf25e2ea3daa255dff27d7c6a4dffc
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    user: "0:0"
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
      GF_USERS_ALLOW_SIGN_UP: "false"
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  litellm-prod:
    profiles: [prod]
    image: ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.prod.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/litellm_prod
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PROXY_BASE_URL: https://${LITELLM_PROD_HOST}
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
      xberg:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-prod.rule=Host(`${LITELLM_PROD_HOST}`)
      - traefik.http.routers.litellm-prod.entrypoints=websecure
      - traefik.http.routers.litellm-prod.tls=true
      - traefik.http.services.litellm-prod.loadbalancer.server.port=4000

  litellm-dev:
    profiles: [dev]
    image: ghcr.io/berriai/litellm:v1.107.0-dev.3@sha256:e7f68da02ed3ec52f0b8d386dbb278a0aa06dbc879f5ddda5a3cf87b2bff194c
    command:
      - --config=/app/config.yaml
      - --port=4000
    volumes:
      - ./litellm/config.dev.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/litellm_dev
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PG_VECTOR_API_BASE: http://litellm-pgvector:8000
      PG_VECTOR_API_KEY: ${PG_VECTOR_API_KEY}
      VECTOR_DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD}@vector-postgres:5432/vector_store
      XBERG_INDEX_EMBEDDING_MODEL: ollama/bge-m3
      XBERG_INDEX_EMBEDDING_API_BASE: http://host.docker.internal:11434
      PROXY_BASE_URL: https://${LITELLM_DEV_HOST}
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
      xberg:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-dev.rule=Host(`${LITELLM_DEV_HOST}`)
      - traefik.http.routers.litellm-dev.entrypoints=websecure
      - traefik.http.routers.litellm-dev.tls=true
      - traefik.http.services.litellm-dev.loadbalancer.server.port=4000

  litellm-pgvector:
    profiles: [dev]
    image: litellm-pgvector:5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    build:
      context: .
      dockerfile: pgvector/Dockerfile
      additional_contexts:
        upstream: https://github.com/BerriAI/litellm-pgvector.git#5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    environment:
      DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD}@vector-postgres:5432/vector_store?schema=public
      SERVER_API_KEY: ${PG_VECTOR_API_KEY}
      HOST: 0.0.0.0
      PORT: "8000"
      EMBEDDING__MODEL: openai/bge-m3
      EMBEDDING__BASE_URL: http://litellm-dev:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING__DIMENSIONS: "1024"
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
      litellm-dev:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  pgvector-exporter:
    image: prometheuscommunity/postgres-exporter:latest@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://vector:${PG_VECTOR_PASSWORD}@vector-postgres:5432/vector_store?sslmode=disable
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks: [internal]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:latest@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    networks: [internal]
    restart: unless-stopped
