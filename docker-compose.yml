name: ${COMPOSE_PROJECT_NAME:-litellm-stack}

x-langfuse-environment: &langfuse-environment
  HOSTNAME: 0.0.0.0
  TZ: UTC
  NEXTAUTH_URL: https://${LANGFUSE_WEB_HOST:-langfuse.example.test}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "${LANGFUSE_TELEMETRY_ENABLED:-false}"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
  REDIS_TLS_ENABLED: "${LANGFUSE_REDIS_TLS_ENABLED:-false}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

networks:
  edge: {}
  internal: {}
  security-monitor: {}
  traefik-monitor:
    internal: true
  alloy-monitor:
    internal: true
  xberg-sandbox:
    internal: true
  egress: {}

volumes:
  pg-data: {}
  pgvector-data: {}
  grafana-data: {}
  prometheus-data: {}
  prometheus-secrets: {}
  loki-data: {}
  alloy-data: {}
  alloy-loki-data: {}
  opensearch-data: {}
  opensearch-ca-private: {}
  opensearch-ca: {}
  opensearch-node-certs: {}
  opensearch-admin-certs: {}
  langfuse-postgres-data: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-minio-data: {}
  langfuse-redis-data: {}
  bge-m3-vllm-cache: {}

services:
  traefik:
    logging: *default-logging
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-litellm-stack}_edge
      - --providers.docker.endpoint=tcp://traefik-docker-proxy:2375
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --accesslog=true
      - --accesslog.format=json
      # Never persist client addresses or credentials; request headers are
      # dropped by Traefik's default header mode.
      - --accesslog.fields.names.ClientHost=drop
      - --accesslog.fields.names.ClientAddr=drop
      - --accesslog.fields.names.ClientPort=drop
      - --accesslog.fields.names.ClientUsername=drop
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - type: bind
        source: ${TRAEFIK_TLS_CERT_FILE:-./traefik/certs/litellm-stack.pem}
        target: /certs/tls.crt
        read_only: true
      - type: bind
        source: ${TRAEFIK_TLS_KEY_FILE:-./traefik/certs/litellm-stack-key.pem}
        target: /certs/tls.key
        read_only: true
    depends_on:
      traefik-docker-proxy:
        condition: service_healthy
    networks: [edge, internal, traefik-monitor]
    restart: unless-stopped

  traefik-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [traefik-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: litellm_prod
      POSTGRES_USER: ${PG_USER:-litellm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    logging: *default-logging
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      OPENSEARCH_DATABASE_PASSWORD: ${OPENSEARCH_DATABASE_PASSWORD:?Set OPENSEARCH_DATABASE_PASSWORD in .env}
      # Optional: only required when the grafana profile is used.
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:-}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}
      ROI_MINUTES_SAVED_PER_REQUEST: "${ROI_MINUTES_SAVED_PER_REQUEST:-15}"
      ROI_MINUTES_SAVED_PER_SESSION: "${ROI_MINUTES_SAVED_PER_SESSION:-0}"
      ROI_LOADED_HOURLY_COST: "${ROI_LOADED_HOURLY_COST:-75}"
      ROI_VALUE_REALIZATION_FACTOR: "${ROI_VALUE_REALIZATION_FACTOR:-0.25}"
      ROI_CURRENCY: "${ROI_CURRENCY:-USD}"
    command:
      - /bin/sh
      - -ec
      - |
        psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
        \getenv opensearch_password OPENSEARCH_DATABASE_PASSWORD
        \getenv exporter_password PG_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE opensearch_ro LOGIN PASSWORD %L', :'opensearch_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'opensearch_ro') \gexec
        SELECT format('ALTER ROLE opensearch_ro PASSWORD %L', :'opensearch_password') \gexec
        SELECT format('CREATE ROLE litellm_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'litellm_exporter') \gexec
        SELECT format('ALTER ROLE litellm_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO litellm_exporter;
        GRANT CONNECT ON DATABASE postgres TO litellm_exporter;
        SQL
        readers="opensearch_ro"
        if [ -n "$${GRAFANA_DATABASE_PASSWORD}" ]; then
          psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
        \getenv grafana_password GRAFANA_DATABASE_PASSWORD
        SELECT format('CREATE ROLE grafana_ro LOGIN PASSWORD %L', :'grafana_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_ro') \gexec
        SELECT format('ALTER ROLE grafana_ro PASSWORD %L', :'grafana_password') \gexec
        SQL
          readers="$${readers} grafana_ro"
        fi
        for db in litellm_prod litellm_dev; do
          exists="$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname='$${db}'")"
          if [ "$${exists}" != "1" ]; then
            psql --dbname postgres --command "CREATE DATABASE \"$${db}\""
          fi
          psql --dbname "$${db}" --set ON_ERROR_STOP=1 <<'SQL'
        \getenv roi_request_minutes ROI_MINUTES_SAVED_PER_REQUEST
        \getenv roi_session_minutes ROI_MINUTES_SAVED_PER_SESSION
        \getenv roi_hourly_cost ROI_LOADED_HOURLY_COST
        \getenv roi_realization ROI_VALUE_REALIZATION_FACTOR
        \getenv roi_currency ROI_CURRENCY
        CREATE TABLE IF NOT EXISTS "LiteLLM_ManagementROIConfig" (
          singleton smallint PRIMARY KEY DEFAULT 1 CHECK (singleton = 1),
          minutes_saved_per_request numeric NOT NULL CHECK (minutes_saved_per_request BETWEEN 0 AND 1440),
          minutes_saved_per_session numeric NOT NULL CHECK (minutes_saved_per_session BETWEEN 0 AND 10080),
          loaded_hourly_cost numeric NOT NULL CHECK (loaded_hourly_cost BETWEEN 0 AND 10000),
          value_realization_factor numeric NOT NULL CHECK (value_realization_factor BETWEEN 0 AND 1),
          currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
          updated_at timestamptz NOT NULL DEFAULT NOW()
        );
        REVOKE ALL ON TABLE "LiteLLM_ManagementROIConfig" FROM PUBLIC;
        INSERT INTO "LiteLLM_ManagementROIConfig" (
          singleton,
          minutes_saved_per_request,
          minutes_saved_per_session,
          loaded_hourly_cost,
          value_realization_factor,
          currency,
          updated_at
        ) VALUES (
          1,
          :'roi_request_minutes'::numeric,
          :'roi_session_minutes'::numeric,
          :'roi_hourly_cost'::numeric,
          :'roi_realization'::numeric,
          :'roi_currency',
          NOW()
        )
        ON CONFLICT (singleton) DO UPDATE SET
          minutes_saved_per_request = EXCLUDED.minutes_saved_per_request,
          minutes_saved_per_session = EXCLUDED.minutes_saved_per_session,
          loaded_hourly_cost = EXCLUDED.loaded_hourly_cost,
          value_realization_factor = EXCLUDED.value_realization_factor,
          currency = EXCLUDED.currency,
          updated_at = EXCLUDED.updated_at;
        SQL
          for reader in $${readers}; do
            psql --dbname "$${db}" --set ON_ERROR_STOP=1 --set database_name="$${db}" --set reader="$${reader}" <<'SQL'
        GRANT CONNECT ON DATABASE :"database_name" TO :"reader";
        GRANT USAGE ON SCHEMA public TO :"reader";
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"reader";
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO :"reader";
        SQL
          done
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  vector-postgres:
    logging: *default-logging
    image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: vector_store
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    logging: *default-logging
    profiles: [dev]
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage:rw,noexec,nosuid,size=${QDRANT_STORAGE_SIZE:-1g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-1}"
          memory: ${QDRANT_MEMORY_LIMIT:-2g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  bge-m3-vllm:
    logging: *default-logging
    profiles: [dev]
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    command:
      - --model
      - ${BGE_M3_MODEL:-BAAI/bge-m3}
      - --served-model-name
      - ${BGE_M3_SERVED_MODEL_NAME:-bge-m3}
      - --runner
      - pooling
      - --dtype
      - ${BGE_M3_DTYPE:-half}
      - --max-model-len
      - "${BGE_M3_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - ${BGE_M3_VLLM_GPU_MEMORY_UTILIZATION:-0.35}
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /tmp/vllm
    volumes:
      - bge-m3-vllm-cache:/root/.cache/huggingface
    shm_size: ${BGE_M3_SHM_SIZE:-2gb}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-6g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: ${BGE_M3_HEALTH_START_PERIOD:-15m}

  pgvector-migrate:
    logging: *default-logging
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /migrations/20-litellm-pgvector.sql
    volumes:
      - ./pgvector/migrate.sql:/migrations/20-litellm-pgvector.sql:ro
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  pgvector-access-init:
    logging: *default-logging
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
      PG_VECTOR_EXPORTER_PASSWORD: ${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        psql --set ON_ERROR_STOP=1 <<'SQL'
        \getenv exporter_password PG_VECTOR_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE vector_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vector_exporter') \gexec
        SELECT format('ALTER ROLE vector_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO vector_exporter;
        GRANT CONNECT ON DATABASE vector_store TO vector_exporter;
        SQL
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  presidio-analyzer:
    logging: *default-logging
    image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    environment:
      PRESIDIO_NLP_ENGINE: ${PRESIDIO_NLP_ENGINE:-spacy}
      PRESIDIO_SUPPORTED_LANGUAGES: ${PRESIDIO_SUPPORTED_LANGUAGES:-en}
      NLP_CONF_FILE: /app/presidio_analyzer/conf/litellm-analyzer.yaml
    volumes:
      - ./presidio/analyzer.yaml:/app/presidio_analyzer/conf/litellm-analyzer.yaml:ro
    deploy:
      resources:
        limits:
          memory: ${PRESIDIO_ANALYZER_MEMORY_LIMIT:-2g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  presidio-anonymizer:
    logging: *default-logging
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    logging: *default-logging
    image: searxng/searxng:2026.10.30-ffa88e3ba@sha256:f4aa660c54d062dedb268be84e821ea24e39f48c7a496af8dd02cc9eedb93847
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOST:-search.example.test}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOST:-search.example.test}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080

  xberg:
    logging: *default-logging
    profiles: [prod, dev]
    image: ghcr.io/xberg-io/xberg:1.3.10-core@sha256:f0a66d39f7322c273bb4ba2b53f5ca00dee9f2f1b3ebbec26a283017e07a865b
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allowed-host
      - xberg
      - --allowed-host
      - xberg:8001
    environment:
      RUST_LOG: ${XBERG_LOG_LEVEL:-info}
      XBERG_CACHE_DIR: /tmp/xberg-cache
      HF_HOME: /tmp/huggingface
      XBERG_MAX_REQUEST_BODY_BYTES: "${XBERG_MAX_REQUEST_BODY_BYTES:-10485760}"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "${XBERG_MAX_MULTIPART_FIELD_BYTES:-10485760}"
      HTTP_PROXY: http://xberg-egress-proxy:3128
      HTTPS_PROXY: http://xberg-egress-proxy:3128
      ALL_PROXY: http://xberg-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "${XBERG_CPU_LIMIT:-1}"
          memory: ${XBERG_MEMORY_LIMIT:-1g}
    depends_on:
      xberg-egress-proxy:
        condition: service_healthy
    networks: [xberg-sandbox]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - --request
        - POST
        - --header
        - "Content-Type: application/json"
        - --header
        - "Accept: application/json, text/event-stream"
        - --data
        - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1"}}}'
        - http://127.0.0.1:8001/mcp
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xberg-egress-proxy:
    logging: *default-logging
    image: ubuntu/squid:6.13-25.04_edge@sha256:3de2e64f0ca6efdac3e98557607dc0f23050037f3885016d5d5bfcf9950501b8
    command: ["-f", "/etc/squid/xberg-egress-squid.conf", "-NYC"]
    volumes:
      - ./security/xberg-egress-squid.conf:/etc/squid/xberg-egress-squid.conf:ro
      - ./security/xberg-egress-allowlist.txt:/etc/squid/xberg-egress-allowlist.txt:ro
    networks: [xberg-sandbox, egress]
    read_only: true
    tmpfs:
      - /run:mode=0755
      - /var/log/squid:uid=13,gid=13,mode=0750
      - /var/spool/squid:uid=13,gid=13,mode=0750
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-ec", ": >/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
    volumes:
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    depends_on:
      prometheus-secrets-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  prometheus-secrets-init:
    logging: *default-logging
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 0400 -o 65534 -g 65534 \
          /source/litellm-master-key \
          /target/litellm-master-key
    volumes:
      - ./litellm/secrets/litellm-master-key:/source/litellm-master-key:ro
      - prometheus-secrets:/target
    cap_drop: [ALL]
    # FOWNER lets install(1) set the mode after handing ownership to nobody.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks: [internal]
    restart: "no"

  loki:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      # The distroless Loki image has no shell, wget, or curl.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    user: "473:473"
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-litellm-stack}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      data-prepper:
        condition: service_started
      alloy-docker-proxy:
        condition: service_healthy
    networks: [internal, alloy-monitor]
    restart: unless-stopped

  alloy-loki:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    user: "473:473"
    command: ["run", "/etc/alloy/loki.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-litellm-stack}
    volumes:
      - ./alloy/loki.alloy:/etc/alloy/loki.alloy:ro
      - alloy-loki-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      alloy-docker-proxy:
        condition: service_healthy
    networks: [internal, alloy-monitor]
    restart: unless-stopped

  alloy-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [alloy-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  langfuse-postgres:
    logging: *default-logging
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./langfuse/clickhouse/config.d/observability.xml:/etc/clickhouse-server/config.d/observability.xml:ro
      - ./langfuse/clickhouse/users.d/observability.xml:/etc/clickhouse-server/users.d/observability.xml:ro
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  langfuse-clickhouse-observability-setup:
    logging: *default-logging
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec clickhouse-client \
          --host langfuse-clickhouse \
          --user "$$CLICKHOUSE_USER" \
          --password "$$CLICKHOUSE_PASSWORD" \
          --multiquery \
          --queries-file /cleanup/cleanup-system-logs.sql
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./langfuse/clickhouse/cleanup-system-logs.sql:/cleanup/cleanup-system-logs.sql:ro
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  langfuse-minio:
    logging: *default-logging
    image: cgr.dev/chainguard/minio:latest@sha256:c47b1779bfd12cdf5a4fcd3bd50671b8d66465fdae45271babc2fb467958b712
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
    volumes:
      - langfuse-minio-data:/data
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse-s3.rule=Host(`${LANGFUSE_S3_HOST:-langfuse-s3.example.test}`)
      - traefik.http.routers.langfuse-s3.entrypoints=websecure
      - traefik.http.routers.langfuse-s3.tls=true
      - traefik.http.services.langfuse-s3.loadbalancer.server.port=9000

  langfuse-redis:
    logging: *default-logging
    image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
    volumes:
      - langfuse-redis-data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-worker:
    logging: *default-logging
    image: docker.langfuse.com/langfuse/langfuse-worker:4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
    environment:
      <<: *langfuse-environment
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-clickhouse-observability-setup:
        condition: service_completed_successfully
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    logging: *default-logging
    image: docker.langfuse.com/langfuse/langfuse:4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: https://${LANGFUSE_S3_HOST:-langfuse-s3.example.test}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-litellm-stack}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-LiteLLM Stack}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-litellm}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-LiteLLM}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?Set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?Set LANGFUSE_INIT_USER_NAME in .env}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Set LANGFUSE_INIT_USER_PASSWORD in .env}
      LANGFUSE_TRUSTED_PROXY_COUNT: "${LANGFUSE_TRUSTED_PROXY_COUNT:-1}"
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "${LANGFUSE_DISABLE_SIGNUP_ONBOARDING:-true}"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-clickhouse-observability-setup:
        condition: service_completed_successfully
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse.rule=Host(`${LANGFUSE_WEB_HOST:-langfuse.example.test}`)
      - traefik.http.routers.langfuse.entrypoints=websecure
      - traefik.http.routers.langfuse.tls=true
      - traefik.http.services.langfuse.loadbalancer.server.port=3000

  # Optional: enable with --profile grafana. OpenSearch Dashboards is the
  # default multi-user observability UI.
  grafana:
    logging: *default-logging
    profiles: [grafana]
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # Grafana secrets are optional for the default stack but mandatory here.
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "Set GRAFANA_ADMIN_PASSWORD in .env to use the grafana profile" >&2; exit 64; }
        test -n "$${GF_SECURITY_SECRET_KEY}" || { echo "Set GRAFANA_SECURITY_SECRET_KEY in .env to use the grafana profile" >&2; exit 64; }
        test -n "$${GRAFANA_DATABASE_PASSWORD}" || { echo "Set GRAFANA_DATABASE_PASSWORD in .env to use the grafana profile" >&2; exit 64; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECURITY_SECRET_KEY:-}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-grafana.example.test}
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP:-false}"
      GRAFANA_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana_ro}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.example.test}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  opensearch-certs:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: &opensearch-tools-build
      context: .
      dockerfile: opensearch/tools/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/generate-certs.sh"]
    environment:
      OPENSEARCH_CERT_VALIDITY_DAYS: "${OPENSEARCH_CERT_VALIDITY_DAYS:-397}"
      OPENSEARCH_CERT_RENEW_BEFORE_DAYS: "${OPENSEARCH_CERT_RENEW_BEFORE_DAYS:-30}"
    volumes:
      - opensearch-ca-private:/certs/ca-private
      - opensearch-ca:/certs/ca
      - opensearch-node-certs:/certs/node
      - opensearch-admin-certs:/certs/admin
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"

  opensearch:
    logging: *default-logging
    image: opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_JAVA_HEAP:-1g} -Xmx${OPENSEARCH_JAVA_HEAP:-1g}"
      OPENSEARCH_DATASOURCES_MASTER_KEY: ${OPENSEARCH_DATASOURCES_MASTER_KEY:?Set OPENSEARCH_DATASOURCES_MASTER_KEY in .env}
    volumes:
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - opensearch-node-certs:/usr/share/opensearch/config/certs:ro
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_MEMORY_LIMIT:-3g}
    depends_on:
      opensearch-certs:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      # 401 proves TLS is up and the security index is initialized.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' --cacert /usr/share/opensearch/config/certs/ca.pem https://localhost:9200/)\" = 401"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  opensearch-setup:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: *opensearch-tools-build
    command: ["setup-cluster"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_CA_FILE: /certs/admin/ca.pem
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in .env}
      OPENSEARCH_DASHBOARDS_SERVER_PASSWORD: ${OPENSEARCH_DASHBOARDS_SERVER_PASSWORD:?Set OPENSEARCH_DASHBOARDS_SERVER_PASSWORD in .env}
      OPENSEARCH_INGEST_PASSWORD: ${OPENSEARCH_INGEST_PASSWORD:?Set OPENSEARCH_INGEST_PASSWORD in .env}
      OPENSEARCH_BRIDGE_PASSWORD: ${OPENSEARCH_BRIDGE_PASSWORD:?Set OPENSEARCH_BRIDGE_PASSWORD in .env}
      OPENSEARCH_LOG_RETENTION_DAYS: "${OPENSEARCH_LOG_RETENTION_DAYS:-7}"
      OPENSEARCH_METRICS_RETENTION_DAYS: "${OPENSEARCH_METRICS_RETENTION_DAYS:-15}"
      OPENSEARCH_AUDIT_RETENTION_DAYS: "${OPENSEARCH_AUDIT_RETENTION_DAYS:-90}"
      OPENSEARCH_TRACE_RETENTION_DAYS: "${OPENSEARCH_TRACE_RETENTION_DAYS:-15}"
      OPENSEARCH_BRIDGE_INTERVAL_SECONDS: "${OPENSEARCH_BRIDGE_INTERVAL_SECONDS:-60}"
      OPENSEARCH_ALERT_CHANNEL_ID: ${OPENSEARCH_ALERT_CHANNEL_ID:-}
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - opensearch-admin-certs:/certs/admin:ro
      - ./grafana/alerting:/app/alerting:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  opensearch-dashboards:
    logging: *default-logging
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:256d4cea5928868ac09bca642a0ac8285a2b7e4b7fdd45c4ec06e75a5cf3184c
    environment:
      OPENSEARCH_DASHBOARDS_SERVER_PASSWORD: ${OPENSEARCH_DASHBOARDS_SERVER_PASSWORD:?Set OPENSEARCH_DASHBOARDS_SERVER_PASSWORD in .env}
      OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD: ${OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD:?Set OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD in .env}
    volumes:
      - ./opensearch/dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - opensearch-ca:/usr/share/opensearch-dashboards/config/certs:ro
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5601/api/status); [ \"$$code\" = 200 ] || [ \"$$code\" = 401 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.opensearch-dashboards.rule=Host(`${OPENSEARCH_DASHBOARDS_HOST:-opensearch.example.test}`)
      - traefik.http.routers.opensearch-dashboards.entrypoints=websecure
      - traefik.http.routers.opensearch-dashboards.tls=true
      - traefik.http.services.opensearch-dashboards.loadbalancer.server.port=5601

  opensearch-dashboards-setup:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: *opensearch-tools-build
    command: ["setup-dashboards"]
    environment:
      OPENSEARCH_DASHBOARDS_URL: http://opensearch-dashboards:5601
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in .env}
      ROI_MINUTES_SAVED_PER_REQUEST: "${ROI_MINUTES_SAVED_PER_REQUEST:-15}"
      ROI_MINUTES_SAVED_PER_SESSION: "${ROI_MINUTES_SAVED_PER_SESSION:-0}"
      ROI_LOADED_HOURLY_COST: "${ROI_LOADED_HOURLY_COST:-75}"
      ROI_VALUE_REALIZATION_FACTOR: "${ROI_VALUE_REALIZATION_FACTOR:-0.25}"
      ROI_CURRENCY: "${ROI_CURRENCY:-USD}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  data-prepper:
    logging: *default-logging
    image: opensearchproject/data-prepper:2.16.0@sha256:6e74ebeddfd66549f623e6f3b8131111b34e85695f54bd68aac7563e80d6b546
    entrypoint: ["/bin/bash", "/etc/data-prepper/entrypoint.sh"]
    environment:
      OPENSEARCH_INGEST_PASSWORD: ${OPENSEARCH_INGEST_PASSWORD:?Set OPENSEARCH_INGEST_PASSWORD in .env}
      JAVA_OPTS: "${DATA_PREPPER_JAVA_OPTS:--Xms256m -Xmx512m}"
    volumes:
      - ./opensearch/data-prepper:/etc/data-prepper:ro
      - opensearch-ca:/usr/share/data-prepper/certs:ro
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${DATA_PREPPER_MEMORY_LIMIT:-1g}
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/21892 && : >/dev/tcp/127.0.0.1/21890"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-bridge:
