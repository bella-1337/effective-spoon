include:
  - path: compose.optional.yml
    env_file: .env.optional.example

name: ${COMPOSE_PROJECT_NAME:-litellm-stack}

# Public hostnames are never hard-coded here: every *_HOST value comes from
# .env / .env.optional and defaults there to <service>.${STACK_DOMAIN}.
# Interpolating this extension field makes Compose refuse to render without it.
x-stack-domain: ${STACK_DOMAIN:?Set STACK_DOMAIN in .env}

# OCI image labels for every image this repository builds. The organisation,
# identified by STACK_DOMAIN, is the vendor. Export STACK_REPOSITORY_REVISION
# (for example "$(git rev-parse HEAD)") before building so the revision label
# identifies the exact repository commit. created, source, and url are always
# set so labels inherited from a base image cannot describe the wrong software;
# Docker's own image creation time remains authoritative.
x-own-image-labels: &own-image-labels
  org.opencontainers.image.vendor: ${STACK_DOMAIN:?Set STACK_DOMAIN in .env}
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.revision: ${STACK_REPOSITORY_REVISION:-unknown}
  org.opencontainers.image.source: ${STACK_REPOSITORY_URL:-}
  org.opencontainers.image.url: ${STACK_REPOSITORY_URL:-}
  org.opencontainers.image.created: ""

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

# Resource tiers. Long-running services without a dedicated sizing variable use
# one of these caps; .env sets the values per host. They are limits, not
# reservations, so idle services do not hold the memory.
x-resources-tiny: &resources-tiny
  resources:
    limits:
      cpus: "${RESOURCE_TINY_CPU_LIMIT:-0.5}"
      memory: ${RESOURCE_TINY_MEMORY_LIMIT:-256m}
x-resources-small: &resources-small
  resources:
    limits:
      cpus: "${RESOURCE_SMALL_CPU_LIMIT:-1}"
      memory: ${RESOURCE_SMALL_MEMORY_LIMIT:-1g}
x-resources-medium: &resources-medium
  resources:
    limits:
      cpus: "${RESOURCE_MEDIUM_CPU_LIMIT:-2}"
      memory: ${RESOURCE_MEDIUM_MEMORY_LIMIT:-2g}
x-resources-database: &resources-database
  resources:
    limits:
      cpus: "${RESOURCE_DATABASE_CPU_LIMIT:-2}"
      memory: ${RESOURCE_DATABASE_MEMORY_LIMIT:-4g}
x-resources-litellm: &resources-litellm
  resources:
    limits:
      cpus: "${LITELLM_CPU_LIMIT:-2}"
      memory: ${LITELLM_MEMORY_LIMIT:-4g}

networks:
  traefik-monitor:
    internal: true
  xberg-sandbox:
    internal: true
    ipam:
      config:
        - subnet: "${XBERG_SANDBOX_SUBNET:-172.29.0.0/24}"
  egress: {}

volumes:
  pg-data: {}
  pgvector-data: {}
  prometheus-data: {}
  prometheus-secrets: {}
  alloy-data: {}
  opensearch-data: {}
  opensearch-ca-private: {}
  opensearch-ca: {}
  opensearch-node-certs: {}
  opensearch-admin-certs: {}

services:
  # Services are grouped along the request path: edge, LiteLLM, guardrails and
  # tools, data stores, the dev model plane, then observability. Optional
  # Grafana, Langfuse, Lens, and image-security services live in
  # compose.optional.yml.

  # ---------------------------------------------------------------------------
  # Edge: TLS termination and routing
  # ---------------------------------------------------------------------------

  traefik:
    logging: *default-logging
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-litellm-stack}_edge
      - --providers.docker.endpoint=tcp://traefik-docker-proxy:2375
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=edge-security-headers@file,edge-rate-limit@file,edge-in-flight@file
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --accesslog=true
      - --accesslog.format=json
      # Never persist client addresses or credentials; request headers are
      # dropped by Traefik's default header mode.
      - --accesslog.fields.names.ClientHost=drop
      - --accesslog.fields.names.ClientAddr=drop
      - --accesslog.fields.names.ClientPort=drop
      - --accesslog.fields.names.ClientUsername=drop
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - type: bind
        source: ${TRAEFIK_TLS_CERT_FILE:-./traefik/certs/litellm-stack.pem}
        target: /certs/tls.crt
        read_only: true
      - type: bind
        source: ${TRAEFIK_TLS_KEY_FILE:-./traefik/certs/litellm-stack-key.pem}
        target: /certs/tls.key
        read_only: true
    depends_on:
      traefik-docker-proxy:
        condition: service_healthy
    # Raw sockets would allow ARP spoofing of plaintext internal traffic.
    cap_drop: [NET_RAW]
    networks: [edge, internal, traefik-monitor]
    restart: unless-stopped
    deploy: *resources-small

  traefik-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [traefik-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy: *resources-tiny

  # ---------------------------------------------------------------------------
  # LiteLLM proxies (prod and dev profiles) and demo data
  # ---------------------------------------------------------------------------

  litellm-prod:
    logging: *default-logging
    profiles: [prod]
    image: ghcr.io/berriai/litellm:v1.108.9@sha256:d817e8e4d6698aad9f3d40b6ccbcaa1cde6c8256cb59867553f07383da3d6608
    entrypoint: ["/bin/sh", "-ec"]
    # LiteLLM v1.111 replaced docker/prod_entrypoint.sh with
    # docker-entrypoint.sh (proxy component). Use whichever the image has, so
    # an image-only upgrade or rollback across that release keeps working.
    command:
      - |
        if [ -x /app/docker-entrypoint.sh ]; then set -- /app/docker-entrypoint.sh proxy; else set -- /app/docker/prod_entrypoint.sh; fi
        exec python /app/modules/prepare_runtime_config.py /app/config.yaml /app/runtime-config.yaml \
          -- "$$@" --config=/app/runtime-config.yaml --port=4000
    volumes:
      - ./litellm/config.prod.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
      - ${BRAND_ASSETS_DIR:-./branding/foo-bar}:/app/branding:ro
      - ${GPU_HOST_CA_BUNDLE:?Set GPU_HOST_CA_BUNDLE in .env}:/etc/ssl/certs/gpu-host-ca-bundle.pem:ro
      - ${PROVIDER_SECRETS_DIR:-./litellm/provider-secrets}:/app/secrets:ro
    environment:
      # LiteLLM-native branding. Logo and favicon accept a local PNG/JPEG/WEBP/ICO
      # path under /app/branding or an https:// URL; the rest are LiteLLM
      # Enterprise options and are passed only when set in .env.
      UI_LOGO_PATH: ${UI_LOGO_PATH:-/app/branding/logo.png}
      UI_LOGO_PATH_DARK: ${UI_LOGO_PATH_DARK:-/app/branding/logo-dark.png}
      LITELLM_FAVICON_URL: ${LITELLM_FAVICON_URL:-/app/branding/favicon.png}
      DOCS_TITLE:
      DOCS_DESCRIPTION:
      EMAIL_LOGO_URL:
      EMAIL_SUPPORT_CONTACT:
      EMAIL_SIGNATURE:
      EMAIL_SUBJECT_INVITATION:
      EMAIL_SUBJECT_KEY_CREATED:
      EMAIL_SUBJECT_KEY_ROTATED:
      DATABASE_URL: postgresql://${PG_USER:-litellm}:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/litellm_prod
      STORE_MODEL_IN_DB: "${LITELLM_STORE_MODEL_IN_DB:-True}"
      USE_V2_MIGRATION_RESOLVER: "${LITELLM_USE_V2_MIGRATION_RESOLVER:-false}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      # Data sovereignty: the region every model must stay in, and the optional
      # provider models that prepare_runtime_config.py wires into LiteLLM at
      # startup. A provider is enabled only when its model list is set; see
      # docs/data-sovereignty.md.
      DATA_SOVEREIGNTY_REGION: ${DATA_SOVEREIGNTY_REGION:?Set DATA_SOVEREIGNTY_REGION in .env}
      BEDROCK_MODELS: ${BEDROCK_MODELS:-}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-}
      BEDROCK_ACCESS_KEY_ID: ${BEDROCK_ACCESS_KEY_ID:-}
      BEDROCK_SECRET_ACCESS_KEY: ${BEDROCK_SECRET_ACCESS_KEY:-}
      AZURE_OPENAI_DEPLOYMENTS: ${AZURE_OPENAI_DEPLOYMENTS:-}
      AZURE_OPENAI_REGION: ${AZURE_OPENAI_REGION:-}
      AZURE_OPENAI_API_BASE: ${AZURE_OPENAI_API_BASE:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      VERTEX_MODELS: ${VERTEX_MODELS:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_CREDENTIALS_FILE: ${VERTEX_CREDENTIALS_FILE:-}
      CODING_ROUTER_DEFAULT_MODEL: ${CODING_ROUTER_DEFAULT_MODEL:-}
      CODING_ROUTER_SIMPLE_MODEL: ${CODING_ROUTER_SIMPLE_MODEL:-}
      CODING_ROUTER_MEDIUM_MODEL: ${CODING_ROUTER_MEDIUM_MODEL:-}
      CODING_ROUTER_COMPLEX_MODEL: ${CODING_ROUTER_COMPLEX_MODEL:-}
      CODING_ROUTER_REASONING_MODEL: ${CODING_ROUTER_REASONING_MODEL:-}
      CODING_ROUTER_SIMPLE_KEYWORDS: ${CODING_ROUTER_SIMPLE_KEYWORDS:-}
      CODING_ROUTER_MEDIUM_KEYWORDS: ${CODING_ROUTER_MEDIUM_KEYWORDS:-}
      CODING_ROUTER_COMPLEX_KEYWORDS: ${CODING_ROUTER_COMPLEX_KEYWORDS:-}
      CODING_ROUTER_REASONING_KEYWORDS: ${CODING_ROUTER_REASONING_KEYWORDS:-}
      CODING_ROUTER_CLASSIFIER: ${CODING_ROUTER_CLASSIFIER:-}
      CODING_ROUTER_CLASSIFIER_TIMEOUT_MS: ${CODING_ROUTER_CLASSIFIER_TIMEOUT_MS:-}
      CODING_ROUTER_ADAPTIVE: ${CODING_ROUTER_ADAPTIVE:-}
      CODING_ROUTER_SESSION_AFFINITY: ${CODING_ROUTER_SESSION_AFFINITY:-}
      CODING_ROUTER_STALL_ESCALATION: ${CODING_ROUTER_STALL_ESCALATION:-}
      D3_DECISION_API_BASE: ${D3_DECISION_API_BASE:?Set D3_DECISION_API_BASE in .env}
      D3_DECISION_API_KEY: ${D3_DECISION_API_KEY:?Set D3_DECISION_API_KEY in .env}
      # Optional local model, served by your own vLLM server, for language and
      # personal-data detection before Presidio (pii-assist guardrail); empty
      # disables it. Never a cloud API. The key is required when it is set.
      PII_ASSIST_API_BASE: ${PII_ASSIST_API_BASE:-}
      PII_ASSIST_API_KEY: ${PII_ASSIST_API_KEY:-}
      PII_ASSIST_VLLM_MODEL: ${PII_ASSIST_VLLM_MODEL:-gemma4}
      PII_ASSIST_MAX_CHUNK_CHARS: "${PII_ASSIST_MAX_CHUNK_CHARS:-4000}"
      PII_ASSIST_MAX_CALLS: "${PII_ASSIST_MAX_CALLS:-3}"
      PII_ASSIST_TIMEOUT_SECONDS: "${PII_ASSIST_TIMEOUT_SECONDS:-20}"
      # true: masked values go to the provider as numbered tokens (<PERSON_1>)
      # and come back as the original values in the response; the request
      # keeps them AES-GCM encrypted with a per-process key. See
      # litellm/modules/pii_vault.py.
      PII_REVERSIBLE_MASKING: "${PII_REVERSIBLE_MASKING:-false}"
      # Public roots plus the GPU host mkcert CA (D3-mini and BGE-M3 over TLS).
      SSL_CERT_FILE: /etc/ssl/certs/gpu-host-ca-bundle.pem
      LITELLM_OTEL_V2: "${LITELLM_OTEL_V2:-true}"
      # Request and service spans also go to OpenSearch Trace Analytics through
      # Data Prepper; Langfuse keeps its own exporter.
      OTEL_EXPORTER: ${LITELLM_OTEL_TRACE_EXPORTER:-otlp_grpc}
      OTEL_ENDPOINT: http://data-prepper:21890
      OTEL_SERVICE_NAME: litellm-prod
      OTEL_ENVIRONMENT_NAME: production
      LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS: ""
      LITELLM_OTEL_BAGGAGE_METADATA_KEYS: ""
      LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS: ""
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      # Optional LiteLLM Lens connection (lens profile). The runtime-config
      # launcher removes these when the lens service is not running.
      LITELLM_LENS_URL: http://lens:4318
      LITELLM_LENS_PUBLIC_URL: https://${LENS_HOST:-}
      LITELLM_LENS_SERVICE_TOKEN: ${LITELLM_LENS_SERVICE_TOKEN:-}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:-}
      PROXY_BASE_URL: https://${LITELLM_PROD_HOST:?Set LITELLM_PROD_HOST in .env}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
        required: false
      lens:
        condition: service_healthy
        required: false
    cap_drop: [NET_RAW]
    # Reaches a model server on the Docker host, such as the vLLM server for
    # PII_ASSIST_API_BASE (built in on Docker Desktop; needed on Linux).
    extra_hosts:
      - host.docker.internal:host-gateway
    # d3-local reaches the optional on-host D3-mini (d3 profile). No
    # dependency: until it is healthy, coding-router classifies locally.
    networks: [edge, internal, xberg-sandbox, d3-local]
    restart: unless-stopped
    deploy: *resources-litellm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-prod.rule=Host(`${LITELLM_PROD_HOST:?Set LITELLM_PROD_HOST in .env}`)
      - traefik.http.routers.litellm-prod.entrypoints=websecure
      - traefik.http.routers.litellm-prod.tls=true
      # Serve LITELLM_FAVICON_URL at /favicon.ico too; see litellm-favicon in
      # traefik/dynamic.yml.
      - traefik.http.routers.litellm-prod-favicon.rule=Host(`${LITELLM_PROD_HOST:?Set LITELLM_PROD_HOST in .env}`) && Path(`/favicon.ico`)
      - traefik.http.routers.litellm-prod-favicon.entrypoints=websecure
      - traefik.http.routers.litellm-prod-favicon.tls=true
      - traefik.http.routers.litellm-prod-favicon.middlewares=litellm-favicon@file
      - traefik.http.routers.litellm-prod-favicon.service=litellm-prod
      - traefik.http.services.litellm-prod.loadbalancer.server.port=4000

  litellm-demo-data-prod:
    logging: *default-logging
    profiles: [demo]
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      PGHOST: postgres
      PGDATABASE: litellm_prod
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /seed/demo-data.sql
    volumes:
      - ./litellm/demo-data.sql:/seed/demo-data.sql:ro
    depends_on:
      litellm-prod:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  litellm-dev:
    logging: *default-logging
    profiles: [dev]
    image: ghcr.io/berriai/litellm:v1.111.0-dev.4@sha256:f38bf0888c091db9079396e17fc8f028d6b75cd26c3e8cb45c5fbdd1f3b66f87
    entrypoint: ["/bin/sh", "-ec"]
    # LiteLLM v1.111 replaced docker/prod_entrypoint.sh with
    # docker-entrypoint.sh (proxy component). Use whichever the image has, so
    # an image-only upgrade or rollback across that release keeps working.
    command:
      - |
        if [ -x /app/docker-entrypoint.sh ]; then set -- /app/docker-entrypoint.sh proxy; else set -- /app/docker/prod_entrypoint.sh; fi
        exec python /app/modules/prepare_runtime_config.py /app/config.yaml /app/runtime-config.yaml \
          -- "$$@" --config=/app/runtime-config.yaml --port=4000
    volumes:
      - ./litellm/config.dev.yaml:/app/config.yaml:ro
      - ./litellm/modules:/app/modules:ro
      - ${BRAND_ASSETS_DIR:-./branding/foo-bar}:/app/branding:ro
      - ${GPU_HOST_CA_BUNDLE:?Set GPU_HOST_CA_BUNDLE in .env}:/etc/ssl/certs/gpu-host-ca-bundle.pem:ro
      - ${PROVIDER_SECRETS_DIR:-./litellm/provider-secrets}:/app/secrets:ro
    environment:
      # LiteLLM-native branding. Logo and favicon accept a local PNG/JPEG/WEBP/ICO
      # path under /app/branding or an https:// URL; the rest are LiteLLM
      # Enterprise options and are passed only when set in .env.
      UI_LOGO_PATH: ${UI_LOGO_PATH:-/app/branding/logo.png}
      UI_LOGO_PATH_DARK: ${UI_LOGO_PATH_DARK:-/app/branding/logo-dark.png}
      LITELLM_FAVICON_URL: ${LITELLM_FAVICON_URL:-/app/branding/favicon.png}
      DOCS_TITLE:
      DOCS_DESCRIPTION:
      EMAIL_LOGO_URL:
      EMAIL_SUPPORT_CONTACT:
      EMAIL_SIGNATURE:
      EMAIL_SUBJECT_INVITATION:
      EMAIL_SUBJECT_KEY_CREATED:
      EMAIL_SUBJECT_KEY_ROTATED:
      DATABASE_URL: postgresql://${PG_USER:-litellm}:${PG_PASSWORD:?Set PG_PASSWORD in .env}@postgres:5432/litellm_dev
      STORE_MODEL_IN_DB: "${LITELLM_STORE_MODEL_IN_DB:-True}"
      USE_V2_MIGRATION_RESOLVER: "${LITELLM_USE_V2_MIGRATION_RESOLVER:-false}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      # Data sovereignty: the region every model must stay in, and the optional
      # provider models that prepare_runtime_config.py wires into LiteLLM at
      # startup. A provider is enabled only when its model list is set; see
      # docs/data-sovereignty.md.
      DATA_SOVEREIGNTY_REGION: ${DATA_SOVEREIGNTY_REGION:?Set DATA_SOVEREIGNTY_REGION in .env}
      BEDROCK_MODELS: ${BEDROCK_MODELS:-}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-}
      BEDROCK_ACCESS_KEY_ID: ${BEDROCK_ACCESS_KEY_ID:-}
      BEDROCK_SECRET_ACCESS_KEY: ${BEDROCK_SECRET_ACCESS_KEY:-}
      AZURE_OPENAI_DEPLOYMENTS: ${AZURE_OPENAI_DEPLOYMENTS:-}
      AZURE_OPENAI_REGION: ${AZURE_OPENAI_REGION:-}
      AZURE_OPENAI_API_BASE: ${AZURE_OPENAI_API_BASE:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      VERTEX_MODELS: ${VERTEX_MODELS:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_CREDENTIALS_FILE: ${VERTEX_CREDENTIALS_FILE:-}
      CODING_ROUTER_DEFAULT_MODEL: ${CODING_ROUTER_DEFAULT_MODEL:-}
      CODING_ROUTER_SIMPLE_MODEL: ${CODING_ROUTER_SIMPLE_MODEL:-}
      CODING_ROUTER_MEDIUM_MODEL: ${CODING_ROUTER_MEDIUM_MODEL:-}
      CODING_ROUTER_COMPLEX_MODEL: ${CODING_ROUTER_COMPLEX_MODEL:-}
      CODING_ROUTER_REASONING_MODEL: ${CODING_ROUTER_REASONING_MODEL:-}
      CODING_ROUTER_SIMPLE_KEYWORDS: ${CODING_ROUTER_SIMPLE_KEYWORDS:-}
      CODING_ROUTER_MEDIUM_KEYWORDS: ${CODING_ROUTER_MEDIUM_KEYWORDS:-}
      CODING_ROUTER_COMPLEX_KEYWORDS: ${CODING_ROUTER_COMPLEX_KEYWORDS:-}
      CODING_ROUTER_REASONING_KEYWORDS: ${CODING_ROUTER_REASONING_KEYWORDS:-}
      CODING_ROUTER_CLASSIFIER: ${CODING_ROUTER_CLASSIFIER:-}
      CODING_ROUTER_CLASSIFIER_TIMEOUT_MS: ${CODING_ROUTER_CLASSIFIER_TIMEOUT_MS:-}
      CODING_ROUTER_ADAPTIVE: ${CODING_ROUTER_ADAPTIVE:-}
      CODING_ROUTER_SESSION_AFFINITY: ${CODING_ROUTER_SESSION_AFFINITY:-}
      CODING_ROUTER_STALL_ESCALATION: ${CODING_ROUTER_STALL_ESCALATION:-}
      D3_DECISION_API_BASE: ${D3_DECISION_API_BASE:?Set D3_DECISION_API_BASE in .env}
      D3_DECISION_API_KEY: ${D3_DECISION_API_KEY:?Set D3_DECISION_API_KEY in .env}
      # Optional local model, served by your own vLLM server, for language and
      # personal-data detection before Presidio (pii-assist guardrail); empty
      # disables it. Never a cloud API. The key is required when it is set.
      PII_ASSIST_API_BASE: ${PII_ASSIST_API_BASE:-}
      PII_ASSIST_API_KEY: ${PII_ASSIST_API_KEY:-}
      PII_ASSIST_VLLM_MODEL: ${PII_ASSIST_VLLM_MODEL:-gemma4}
      PII_ASSIST_MAX_CHUNK_CHARS: "${PII_ASSIST_MAX_CHUNK_CHARS:-4000}"
      PII_ASSIST_MAX_CALLS: "${PII_ASSIST_MAX_CALLS:-3}"
      PII_ASSIST_TIMEOUT_SECONDS: "${PII_ASSIST_TIMEOUT_SECONDS:-20}"
      # true: masked values go to the provider as numbered tokens (<PERSON_1>)
      # and come back as the original values in the response; the request
      # keeps them AES-GCM encrypted with a per-process key. See
      # litellm/modules/pii_vault.py.
      PII_REVERSIBLE_MASKING: "${PII_REVERSIBLE_MASKING:-false}"
      # Public roots plus the GPU host mkcert CA (D3-mini and BGE-M3 over TLS).
      SSL_CERT_FILE: /etc/ssl/certs/gpu-host-ca-bundle.pem
      LITELLM_OTEL_V2: "${LITELLM_OTEL_V2:-true}"
      # Request and service spans also go to OpenSearch Trace Analytics through
      # Data Prepper; Langfuse keeps its own exporter.
      OTEL_EXPORTER: ${LITELLM_OTEL_TRACE_EXPORTER:-otlp_grpc}
      OTEL_ENDPOINT: http://data-prepper:21890
      OTEL_SERVICE_NAME: litellm-dev
      OTEL_ENVIRONMENT_NAME: development
      LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS: ""
      LITELLM_OTEL_BAGGAGE_METADATA_KEYS: ""
      LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS: ""
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_USER_ID_SALT: ${LANGFUSE_USER_ID_SALT:-}
      LANGFUSE_HOST: http://langfuse-web:3000
      # Optional LiteLLM Lens connection (lens profile). The runtime-config
      # launcher removes these when the lens service is not running.
      LITELLM_LENS_URL: http://lens:4318
      LITELLM_LENS_PUBLIC_URL: https://${LENS_HOST:-}
      LITELLM_LENS_SERVICE_TOKEN: ${LITELLM_LENS_SERVICE_TOKEN:-}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:-}
      PG_VECTOR_API_BASE: http://litellm-pgvector:8000
      PG_VECTOR_API_KEY: ${PG_VECTOR_API_KEY:?Set PG_VECTOR_API_KEY in .env}
      VECTOR_DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}@vector-postgres:5432/vector_store
      QDRANT_API_BASE: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      # BGE-M3 runs on the remote GPU host behind its TLS proxy (gpu-host/).
      BGE_M3_API_BASE: ${BGE_M3_API_BASE:?Set BGE_M3_API_BASE in .env}
      BGE_M3_API_KEY: ${BGE_M3_API_KEY:?Set BGE_M3_API_KEY in .env}
      XBERG_INDEX_EMBEDDING_MODEL: ${XBERG_INDEX_EMBEDDING_MODEL:-hosted_vllm/bge-m3}
      XBERG_INDEX_EMBEDDING_API_BASE: ${BGE_M3_API_BASE:?Set BGE_M3_API_BASE in .env}
      XBERG_INDEX_EMBEDDING_API_KEY: ${BGE_M3_API_KEY:?Set BGE_M3_API_KEY in .env}
      XBERG_AUTO_INDEX_ENABLED: ${XBERG_AUTO_INDEX_ENABLED:-false}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      PROXY_BASE_URL: https://${LITELLM_DEV_HOST:?Set LITELLM_DEV_HOST in .env}
      FORWARDED_ALLOW_IPS: "${LITELLM_FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
      xberg:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
        required: false
      lens:
        condition: service_healthy
        required: false
    cap_drop: [NET_RAW]
    # Reaches a model server on the Docker host, such as the vLLM server for
    # PII_ASSIST_API_BASE (built in on Docker Desktop; needed on Linux).
    extra_hosts:
      - host.docker.internal:host-gateway
    # d3-local reaches the optional on-host D3-mini (d3 profile). No
    # dependency: until it is healthy, coding-router classifies locally.
    networks: [edge, internal, xberg-sandbox, d3-local]
    restart: unless-stopped
    deploy: *resources-litellm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-dev.rule=Host(`${LITELLM_DEV_HOST:?Set LITELLM_DEV_HOST in .env}`)
      - traefik.http.routers.litellm-dev.entrypoints=websecure
      - traefik.http.routers.litellm-dev.tls=true
      # Serve LITELLM_FAVICON_URL at /favicon.ico too; see litellm-favicon in
      # traefik/dynamic.yml.
      - traefik.http.routers.litellm-dev-favicon.rule=Host(`${LITELLM_DEV_HOST:?Set LITELLM_DEV_HOST in .env}`) && Path(`/favicon.ico`)
      - traefik.http.routers.litellm-dev-favicon.entrypoints=websecure
      - traefik.http.routers.litellm-dev-favicon.tls=true
      - traefik.http.routers.litellm-dev-favicon.middlewares=litellm-favicon@file
      - traefik.http.routers.litellm-dev-favicon.service=litellm-dev
      - traefik.http.services.litellm-dev.loadbalancer.server.port=4000

  litellm-demo-data-dev:
    logging: *default-logging
    profiles: [dev]
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      PGHOST: postgres
      PGDATABASE: litellm_dev
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /seed/demo-data.sql
    volumes:
      - ./litellm/demo-data.sql:/seed/demo-data.sql:ro
    depends_on:
      litellm-dev:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Guardrails and tools: Presidio, SearXNG, and the Xberg MCP sandbox
  # ---------------------------------------------------------------------------

  presidio-analyzer:
    logging: *default-logging
    image: litellm-presidio-analyzer:2.2.362-1
    # The upstream image ships only English; presidio/Dockerfile adds the
    # pinned German and French spaCy pipelines.
    build:
      context: .
      dockerfile: presidio/Dockerfile
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-presidio-analyzer
        org.opencontainers.image.description: Presidio analyzer with English, German, and French spaCy pipelines for the LiteLLM stack
        org.opencontainers.image.version: 2.2.362-1
        org.opencontainers.image.base.name: mcr.microsoft.com/presidio-analyzer:2.2.362
        org.opencontainers.image.licenses: MIT AND LGPL-LR
    environment:
      PRESIDIO_NLP_ENGINE: ${PRESIDIO_NLP_ENGINE:-spacy}
      # Informational: the languages come from presidio/analyzer-engine.yaml.
      PRESIDIO_SUPPORTED_LANGUAGES: en,de,fr
      NLP_CONF_FILE: /app/presidio_analyzer/conf/litellm-analyzer.yaml
      ANALYZER_CONF_FILE: /app/presidio_analyzer/conf/stack-analyzer-engine.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: /app/presidio_analyzer/conf/stack-recognizers.yaml
      # Each gunicorn worker is synchronous; one large prompt otherwise
      # serializes the PII guardrail for every caller.
      WORKERS: ${PRESIDIO_ANALYZER_WORKERS:-2}
      # Load the spaCy pipelines once before forking, so workers share them:
      # about 2.7 GiB for two workers instead of 2.4 GiB each.
      GUNICORN_CMD_ARGS: --preload
    volumes:
      - ./presidio/analyzer.yaml:/app/presidio_analyzer/conf/litellm-analyzer.yaml:ro
      - ./presidio/analyzer-engine.yaml:/app/presidio_analyzer/conf/stack-analyzer-engine.yaml:ro
      - ./presidio/recognizers.yaml:/app/presidio_analyzer/conf/stack-recognizers.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "${PRESIDIO_ANALYZER_CPU_LIMIT:-2}"
          # English, German, and French pipelines, shared by the workers.
          memory: ${PRESIDIO_ANALYZER_MEMORY_LIMIT:-4g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  presidio-anonymizer:
    logging: *default-logging
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    environment:
      # A single synchronous worker lets one oversized request stall masking
      # for every caller until gunicorn's 30 s worker timeout.
      WORKERS: ${PRESIDIO_ANONYMIZER_WORKERS:-2}
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-small
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    logging: *default-logging
    image: searxng/searxng:2026.11.15-2d500cb6b@sha256:932f69dca010db9880bddebb2171f05d8e1a25d04a59149ff65409993d680024
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    # Internal-only: reachable by LiteLLM's searxng-search tool and monitoring,
    # never routed by Traefik. Outbound engine queries use the internal bridge.
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-small

  xberg:
    logging: *default-logging
    profiles: [prod, dev]
    image: ghcr.io/xberg-io/xberg:1.5.1-core@sha256:46602967f54ed007fcf261a70822f819a80a3f63e24f53052bf0bb1e0e7c9a4a
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allowed-host
      - xberg
      - --allowed-host
      - xberg:8001
      - --config
      - /etc/xberg/xberg.toml
    volumes:
      - ./security/xberg-config.toml:/etc/xberg/xberg.toml:ro
    environment:
      RUST_LOG: ${XBERG_LOG_LEVEL:-info}
      XBERG_CACHE_DIR: /tmp/xberg-cache
      HF_HOME: /tmp/huggingface
      XBERG_MAX_REQUEST_BODY_BYTES: "${XBERG_MAX_REQUEST_BODY_BYTES:-10485760}"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "${XBERG_MAX_MULTIPART_FIELD_BYTES:-10485760}"
      HTTP_PROXY: http://xberg-egress-proxy:3128
      HTTPS_PROXY: http://xberg-egress-proxy:3128
      ALL_PROXY: http://xberg-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    dns:
      - "${XBERG_DNS_IP:-172.29.0.53}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          cpus: "${XBERG_CPU_LIMIT:-1}"
          memory: ${XBERG_MEMORY_LIMIT:-1g}
    depends_on:
      xberg-dns:
        condition: service_started
      xberg-egress-proxy:
        condition: service_healthy
    networks: [xberg-sandbox]
    restart: unless-stopped
    # The DNS probe must name an allowed destination from
    # security/xberg-destinations.toml; `maintenance.py doctor` checks it.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          getent hosts '${XBERG_HEALTHCHECK_DOMAIN:-docs.xberg.io}' >/dev/null &&
          curl --fail --silent --show-error --output /dev/null
          --request POST
          --header 'Content-Type: application/json'
          --header 'Accept: application/json, text/event-stream'
          --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1"}}}'
          http://127.0.0.1:8001/mcp
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xberg-dns:
    logging: *default-logging
    profiles: [prod, dev]
    image: ubuntu/bind9:9.20-26.04_stable@sha256:7cb9c4d3f8d6457a38ddf6a5d8e5e1cba75907985946cebf696eb5bba39637cc
    # Deny-by-default resolver: an empty authoritative root answers NXDOMAIN
    # locally, and only the delegated allowlist zones are forwarded upstream,
    # so injected URLs cannot exfiltrate data through DNS lookups.
    entrypoint: ["/usr/sbin/named", "-g", "-c", "/etc/bind/xberg-named.conf"]
    volumes:
      - ./security/xberg-dns.conf:/etc/bind/named.conf.options:ro
      - ./security/xberg-dns-zones.conf:/etc/bind/xberg-named.conf:ro
      - ./security/xberg-dns-deny-root.zone:/etc/bind/xberg-deny-root.zone:ro
    networks:
      xberg-sandbox:
        ipv4_address: "${XBERG_DNS_IP:-172.29.0.53}"
      egress: {}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/bind:uid=584792,gid=584792,mode=0750
      - /run/named:uid=584792,gid=584792,mode=0750
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    restart: unless-stopped

  xberg-egress-proxy:
    logging: *default-logging
    # Same profiles as xberg: the proxy's Internet route exists only while
    # Xberg runs.
    profiles: [prod, dev]
    image: ubuntu/squid:7.2-26.04_edge@sha256:42decc7f79b4e1044f4fe9b3a855af2cbfc76652f3191694726e21058443edc9
    # The Ubuntu rock runs as its unprivileged _daemon_ user (584792) under
    # Pebble. Call the image's own entrypoint, which forwards the log files
    # to stdout, so Squid runs as PID 1 with the stack's configuration.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["-f", "/etc/squid/xberg-egress-squid.conf", "-NYC"]
    volumes:
      - ./security/xberg-egress-squid.conf:/etc/squid/xberg-egress-squid.conf:ro
      - ./security/xberg-egress-allowlist.txt:/etc/squid/xberg-egress-allowlist.txt:ro
    networks: [xberg-sandbox, egress]
    read_only: true
    tmpfs:
      - /run:uid=584792,gid=584792,mode=0755
      - /var/log/squid:uid=584792,gid=584792,mode=0750
      - /var/spool/squid:uid=584792,gid=584792,mode=0750
    # Squid never starts as root, and the ICMP pinger is disabled in
    # squid.conf, so it needs no capabilities.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The rock ships no bash; Perl opens the TCP probe instead.
      test: ["CMD", "/usr/bin/perl", "-MIO::Socket::INET", "-e", "exit(IO::Socket::INET->new(PeerAddr => '127.0.0.1:3128', Timeout => 3) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    deploy: *resources-small

  # ---------------------------------------------------------------------------
  # Data stores: LiteLLM PostgreSQL and the shared pgvector store
  # ---------------------------------------------------------------------------

  postgres:
    logging: *default-logging
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_DB: litellm_prod
      POSTGRES_USER: ${PG_USER:-litellm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    logging: *default-logging
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER:-litellm}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      OPENSEARCH_DATABASE_PASSWORD: ${OPENSEARCH_DATABASE_PASSWORD:?Set OPENSEARCH_DATABASE_PASSWORD in .env}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}
      ROI_MINUTES_SAVED_PER_REQUEST: "${ROI_MINUTES_SAVED_PER_REQUEST:-15}"
      ROI_MINUTES_SAVED_PER_SESSION: "${ROI_MINUTES_SAVED_PER_SESSION:-0}"
      ROI_LOADED_HOURLY_COST: "${ROI_LOADED_HOURLY_COST:-75}"
      ROI_VALUE_REALIZATION_FACTOR: "${ROI_VALUE_REALIZATION_FACTOR:-0.25}"
      ROI_CURRENCY: "${ROI_CURRENCY:-USD}"
    command:
      - /bin/sh
      - -ec
      - |
        psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
        \getenv opensearch_password OPENSEARCH_DATABASE_PASSWORD
        \getenv exporter_password PG_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE opensearch_ro LOGIN PASSWORD %L', :'opensearch_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'opensearch_ro') \gexec
        SELECT format('ALTER ROLE opensearch_ro PASSWORD %L', :'opensearch_password') \gexec
        SELECT format('CREATE ROLE litellm_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'litellm_exporter') \gexec
        SELECT format('ALTER ROLE litellm_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO litellm_exporter;
        GRANT CONNECT ON DATABASE postgres TO litellm_exporter;
        SQL
        for db in litellm_prod litellm_dev; do
          exists="$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname='$${db}'")"
          if [ "$${exists}" != "1" ]; then
            psql --dbname postgres --command "CREATE DATABASE \"$${db}\""
          fi
          psql --dbname "$${db}" --set ON_ERROR_STOP=1 <<'SQL'
        \getenv roi_request_minutes ROI_MINUTES_SAVED_PER_REQUEST
        \getenv roi_session_minutes ROI_MINUTES_SAVED_PER_SESSION
        \getenv roi_hourly_cost ROI_LOADED_HOURLY_COST
        \getenv roi_realization ROI_VALUE_REALIZATION_FACTOR
        \getenv roi_currency ROI_CURRENCY
        CREATE TABLE IF NOT EXISTS "LiteLLM_ManagementROIConfig" (
          singleton smallint PRIMARY KEY DEFAULT 1 CHECK (singleton = 1),
          minutes_saved_per_request numeric NOT NULL CHECK (minutes_saved_per_request BETWEEN 0 AND 1440),
          minutes_saved_per_session numeric NOT NULL CHECK (minutes_saved_per_session BETWEEN 0 AND 10080),
          loaded_hourly_cost numeric NOT NULL CHECK (loaded_hourly_cost BETWEEN 0 AND 10000),
          value_realization_factor numeric NOT NULL CHECK (value_realization_factor BETWEEN 0 AND 1),
          currency varchar(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
          updated_at timestamptz NOT NULL DEFAULT NOW()
        );
        REVOKE ALL ON TABLE "LiteLLM_ManagementROIConfig" FROM PUBLIC;
        INSERT INTO "LiteLLM_ManagementROIConfig" (
          singleton,
          minutes_saved_per_request,
          minutes_saved_per_session,
          loaded_hourly_cost,
          value_realization_factor,
          currency,
          updated_at
        ) VALUES (
          1,
          :'roi_request_minutes'::numeric,
          :'roi_session_minutes'::numeric,
          :'roi_hourly_cost'::numeric,
          :'roi_realization'::numeric,
          :'roi_currency',
          NOW()
        )
        ON CONFLICT (singleton) DO UPDATE SET
          minutes_saved_per_request = EXCLUDED.minutes_saved_per_request,
          minutes_saved_per_session = EXCLUDED.minutes_saved_per_session,
          loaded_hourly_cost = EXCLUDED.loaded_hourly_cost,
          value_realization_factor = EXCLUDED.value_realization_factor,
          currency = EXCLUDED.currency,
          updated_at = EXCLUDED.updated_at;
        SQL
          psql --dbname "$${db}" --set ON_ERROR_STOP=1 --set database_name="$${db}" <<'SQL'
        GRANT CONNECT ON DATABASE :"database_name" TO opensearch_ro;
        GRANT USAGE ON SCHEMA public TO opensearch_ro;
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO opensearch_ro;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO opensearch_ro;
        SQL
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  vector-postgres:
    logging: *default-logging
    image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_DB: vector_store
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector-migrate:
    logging: *default-logging
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /migrations/20-litellm-pgvector.sql
    volumes:
      - ./pgvector/migrate.sql:/migrations/20-litellm-pgvector.sql:ro
    depends_on:
      vector-postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  pgvector-access-init:
    logging: *default-logging
    image: postgres:16.16-alpine3.24@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      PGHOST: vector-postgres
      PGDATABASE: vector_store
      PGUSER: vector
      PGPASSWORD: ${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}
      PG_VECTOR_EXPORTER_PASSWORD: ${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        psql --set ON_ERROR_STOP=1 <<'SQL'
        \getenv exporter_password PG_VECTOR_EXPORTER_PASSWORD
        SELECT format('CREATE ROLE vector_exporter LOGIN PASSWORD %L', :'exporter_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vector_exporter') \gexec
        SELECT format('ALTER ROLE vector_exporter PASSWORD %L', :'exporter_password') \gexec
        GRANT pg_monitor TO vector_exporter;
        GRANT CONNECT ON DATABASE vector_store TO vector_exporter;
        SQL
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Development model plane (dev profile): semantic cache and RAG; BGE-M3
  # embeddings run on the remote GPU host
  # ---------------------------------------------------------------------------

  qdrant:
    logging: *default-logging
    profiles: [dev]
    image: qdrant/qdrant:v1.20.1@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage:rw,noexec,nosuid,size=${QDRANT_STORAGE_SIZE:-1g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-1}"
          memory: ${QDRANT_MEMORY_LIMIT:-2g}
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  litellm-pgvector:
    logging: *default-logging
    profiles: [dev]
    image: litellm-pgvector:5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
    build:
      context: .
      dockerfile: pgvector/Dockerfile
      additional_contexts:
        upstream: https://github.com/BerriAI/litellm-pgvector.git#5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-pgvector
        org.opencontainers.image.description: LiteLLM pgvector vector-store connector built from the pinned upstream commit
        org.opencontainers.image.version: 5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
        org.opencontainers.image.base.name: python:3.11-slim-bookworm
        org.opencontainers.image.source: https://github.com/BerriAI/litellm-pgvector
        org.opencontainers.image.url: https://github.com/BerriAI/litellm-pgvector
        org.opencontainers.image.revision: 5bd8f3ab1fa9129e758a2c4b17ba1c6f3047ba24
        org.opencontainers.image.licenses: MIT
    environment:
      DATABASE_URL: postgresql://vector:${PG_VECTOR_PASSWORD:?Set PG_VECTOR_PASSWORD in .env}@vector-postgres:5432/vector_store?schema=public
      SERVER_API_KEY: ${PG_VECTOR_API_KEY:?Set PG_VECTOR_API_KEY in .env}
      HOST: 0.0.0.0
      PORT: "8000"
      EMBEDDING__MODEL: ${PGVECTOR_EMBEDDING_MODEL:-openai/bge-m3}
      EMBEDDING__BASE_URL: http://litellm-dev:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      EMBEDDING__DIMENSIONS: "${PGVECTOR_EMBEDDING_DIMENSIONS:-1024}"
    depends_on:
      pgvector-migrate:
        condition: service_completed_successfully
      litellm-dev:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-small
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Observability: metrics and exporters
  # ---------------------------------------------------------------------------

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
    volumes:
      - ./litellm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    depends_on:
      prometheus-secrets-init:
        condition: service_completed_successfully
    # d3-local: scrape the optional on-host D3-mini's vLLM metrics.
    networks: [internal, d3-local]
    restart: unless-stopped
    deploy: *resources-medium

  prometheus-secrets-init:
    logging: *default-logging
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 0400 -o 65534 -g 65534 \
          /source/litellm-master-key \
          /target/litellm-master-key
    volumes:
      - ./litellm/secrets/litellm-master-key:/source/litellm-master-key:ro
      - prometheus-secrets:/target
    cap_drop: [ALL]
    # FOWNER lets install(1) set the mode after handing ownership to nobody.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks: [internal]
    restart: "no"

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://litellm_exporter:${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD in .env}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-tiny

  pgvector-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: postgresql://vector_exporter:${PG_VECTOR_EXPORTER_PASSWORD:?Set PG_VECTOR_EXPORTER_PASSWORD in .env}@vector-postgres:5432/vector_store?sslmode=disable
    depends_on:
      pgvector-access-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-tiny

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - ./security-metrics:/textfile:ro
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-tiny

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-small

  blackbox:
    logging: *default-logging
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    # Only the http_2xx module is used; ICMP probing is not required.
    cap_drop: [NET_RAW]
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-tiny

  # ---------------------------------------------------------------------------
  # Observability: logs, traces, and OpenSearch
  # ---------------------------------------------------------------------------

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    user: "473:473"
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-litellm-stack}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      data-prepper:
        condition: service_started
      alloy-docker-proxy:
        condition: service_healthy
    networks: [internal, alloy-monitor]
    restart: unless-stopped
    deploy: *resources-medium

  alloy-docker-proxy:
    logging: *default-logging
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-warning}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [alloy-monitor]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy: *resources-tiny

  opensearch-certs:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: &opensearch-tools-build
      context: .
      dockerfile: opensearch/tools/Dockerfile
      labels:
        <<: *own-image-labels
        org.opencontainers.image.title: litellm-opensearch-tools
        org.opencontainers.image.description: OpenSearch certificate, cluster, dashboard, and LiteLLM bridge tooling for the LiteLLM stack
        org.opencontainers.image.version: "0.1.0"
        org.opencontainers.image.base.name: ghcr.io/astral-sh/uv:0.9.30-python3.13-bookworm-slim
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/generate-certs.sh"]
    environment:
      OPENSEARCH_CERT_VALIDITY_DAYS: "${OPENSEARCH_CERT_VALIDITY_DAYS:-397}"
      OPENSEARCH_CERT_RENEW_BEFORE_DAYS: "${OPENSEARCH_CERT_RENEW_BEFORE_DAYS:-30}"
    volumes:
      - opensearch-ca-private:/certs/ca-private
      - opensearch-ca:/certs/ca
      - opensearch-node-certs:/certs/node
      - opensearch-admin-certs:/certs/admin
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"

  opensearch:
    logging: *default-logging
    image: opensearchproject/opensearch:3.9.0@sha256:3bf4fe26aeb9f7b03c0ebcb1302bb24e855ee6b89fd926d26a71a83ef6f7e076
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_JAVA_HEAP:-1g} -Xmx${OPENSEARCH_JAVA_HEAP:-1g}"
      OPENSEARCH_DATASOURCES_MASTER_KEY: ${OPENSEARCH_DATASOURCES_MASTER_KEY:?Set OPENSEARCH_DATASOURCES_MASTER_KEY in .env}
    volumes:
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - opensearch-node-certs:/usr/share/opensearch/config/certs:ro
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "${RESOURCE_DATABASE_CPU_LIMIT:-2}"
          memory: ${OPENSEARCH_MEMORY_LIMIT:-3g}
    depends_on:
      opensearch-certs:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      # 401 proves TLS is up and the security index is initialized.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' --cacert /usr/share/opensearch/config/certs/ca.pem https://localhost:9200/)\" = 401"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  opensearch-setup:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: *opensearch-tools-build
    command: ["setup-cluster"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_CA_FILE: /certs/admin/ca.pem
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in .env}
      OPENSEARCH_DASHBOARDS_SERVER_PASSWORD: ${OPENSEARCH_DASHBOARDS_SERVER_PASSWORD:?Set OPENSEARCH_DASHBOARDS_SERVER_PASSWORD in .env}
      OPENSEARCH_INGEST_PASSWORD: ${OPENSEARCH_INGEST_PASSWORD:?Set OPENSEARCH_INGEST_PASSWORD in .env}
      OPENSEARCH_BRIDGE_PASSWORD: ${OPENSEARCH_BRIDGE_PASSWORD:?Set OPENSEARCH_BRIDGE_PASSWORD in .env}
      OPENSEARCH_LOG_RETENTION_DAYS: "${OPENSEARCH_LOG_RETENTION_DAYS:-7}"
      OPENSEARCH_METRICS_RETENTION_DAYS: "${OPENSEARCH_METRICS_RETENTION_DAYS:-15}"
      OPENSEARCH_AUDIT_RETENTION_DAYS: "${OPENSEARCH_AUDIT_RETENTION_DAYS:-90}"
      OPENSEARCH_TRACE_RETENTION_DAYS: "${OPENSEARCH_TRACE_RETENTION_DAYS:-15}"
      OPENSEARCH_BRIDGE_INTERVAL_SECONDS: "${OPENSEARCH_BRIDGE_INTERVAL_SECONDS:-60}"
      OPENSEARCH_ALERT_CHANNEL_ID: ${OPENSEARCH_ALERT_CHANNEL_ID:-}
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - opensearch-admin-certs:/certs/admin:ro
      - ./grafana/alerting:/app/alerting:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  opensearch-dashboards:
    logging: *default-logging
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:46c649e9c4412a56f49bd052c2ca458a2a4933e1706a1843b832b0806e3885dc
    environment:
      OPENSEARCH_DASHBOARDS_SERVER_PASSWORD: ${OPENSEARCH_DASHBOARDS_SERVER_PASSWORD:?Set OPENSEARCH_DASHBOARDS_SERVER_PASSWORD in .env}
      OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD: ${OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD:?Set OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD in .env}
    volumes:
      - ./opensearch/dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - opensearch-ca:/usr/share/opensearch-dashboards/config/certs:ro
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, internal]
    restart: unless-stopped
    deploy: *resources-medium
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5601/api/status); [ \"$$code\" = 200 ] || [ \"$$code\" = 401 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.opensearch-dashboards.rule=Host(`${OPENSEARCH_DASHBOARDS_HOST:?Set OPENSEARCH_DASHBOARDS_HOST in .env}`)
      - traefik.http.routers.opensearch-dashboards.entrypoints=websecure
      - traefik.http.routers.opensearch-dashboards.tls=true
      - traefik.http.services.opensearch-dashboards.loadbalancer.server.port=5601

  opensearch-dashboards-setup:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: *opensearch-tools-build
    command: ["setup-dashboards"]
    environment:
      OPENSEARCH_DASHBOARDS_URL: http://opensearch-dashboards:5601
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in .env}
      ROI_MINUTES_SAVED_PER_REQUEST: "${ROI_MINUTES_SAVED_PER_REQUEST:-15}"
      ROI_MINUTES_SAVED_PER_SESSION: "${ROI_MINUTES_SAVED_PER_SESSION:-0}"
      ROI_LOADED_HOURLY_COST: "${ROI_LOADED_HOURLY_COST:-75}"
      ROI_VALUE_REALIZATION_FACTOR: "${ROI_VALUE_REALIZATION_FACTOR:-0.25}"
      ROI_CURRENCY: "${ROI_CURRENCY:-USD}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  data-prepper:
    logging: *default-logging
    image: opensearchproject/data-prepper:2.17.0@sha256:e5bad3b97dea9b38db77e230b965fce246e013b24e783bc668848e88ccbbc1d6
    entrypoint: ["/bin/bash", "/etc/data-prepper/entrypoint.sh"]
    environment:
      OPENSEARCH_INGEST_PASSWORD: ${OPENSEARCH_INGEST_PASSWORD:?Set OPENSEARCH_INGEST_PASSWORD in .env}
      JAVA_OPTS: "${DATA_PREPPER_JAVA_OPTS:--Xms256m -Xmx512m}"
    volumes:
      - ./opensearch/data-prepper:/etc/data-prepper:ro
      - opensearch-ca:/usr/share/data-prepper/certs:ro
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${RESOURCE_MEDIUM_CPU_LIMIT:-2}"
          memory: ${DATA_PREPPER_MEMORY_LIMIT:-2g}
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
    # d3-local: receive the optional on-host D3-mini's OTLP spans.
    networks: [internal, d3-local]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/21892 && : >/dev/tcp/127.0.0.1/21890"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-bridge:
    logging: *default-logging
    image: litellm-opensearch-tools:0.1.0
    build: *opensearch-tools-build
    command: ["bridge"]
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_CA_FILE: /certs/ca/ca.pem
      OPENSEARCH_USERNAME: litellm_bridge
      OPENSEARCH_PASSWORD: ${OPENSEARCH_BRIDGE_PASSWORD:?Set OPENSEARCH_BRIDGE_PASSWORD in .env}
      PROMETHEUS_URL: http://prometheus:9090
      LITELLM_DATABASE_HOST: postgres
      LITELLM_DATABASE_USER: opensearch_ro
      LITELLM_DATABASE_PASSWORD: ${OPENSEARCH_DATABASE_PASSWORD:?Set OPENSEARCH_DATABASE_PASSWORD in .env}
      OPENSEARCH_BRIDGE_INTERVAL_SECONDS: "${OPENSEARCH_BRIDGE_INTERVAL_SECONDS:-60}"
      OPENSEARCH_USAGE_RETENTION_DAYS: "${OPENSEARCH_USAGE_RETENTION_DAYS:-180}"
      OPENSEARCH_USAGE_OVERLAP_MINUTES: "${OPENSEARCH_USAGE_OVERLAP_MINUTES:-30}"
      OPENSEARCH_SESSION_ID_SALT: ${OPENSEARCH_SESSION_ID_SALT:-${LANGFUSE_USER_ID_SALT:-}}
    volumes:
      - opensearch-ca:/certs/ca:ro
      - ./grafana/alerting:/app/alerting:ro
      - ./opensearch/tools/metrics.yml:/app/metrics.yml:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    networks: [internal]
    restart: unless-stopped
    deploy: *resources-small
    healthcheck:
      test: ["CMD", "python", "-m", "litellm_opensearch", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3m
